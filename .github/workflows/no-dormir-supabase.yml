# ============================================================
# M.E.T.A.S · Que la nube no se duerma en vacaciones
# ------------------------------------------------------------
# El plan gratuito de Supabase PAUSA el proyecto tras siete días
# sin una sola petición. Y el calendario hondureño tiene un hueco
# de tres meses: de noviembre a febrero las aulas están cerradas,
# nadie abre la aplicación, y la nube se apaga sola.
#
# Lo que eso le cuesta al maestro no es una pantalla lenta: en
# febrero entra a preparar el año, no le carga la lista de su
# aula, y da por hecho que perdió el trabajo del curso pasado.
# (No lo pierde —los datos siguen ahí— pero eso él no lo sabe, y
# reactivar el proyecto es a mano y desde el panel de Supabase.)
#
# Esto lo evita con una petición de lectura cada tres días. Tres
# y no siete a propósito: con siete, una sola ejecución que falle
# —GitHub tiene retrasos en los `schedule`— ya deja pasar el plazo.
#
# La petición es a la raíz de la API REST: no toca ninguna tabla,
# no escribe nada y no lleva credenciales de nadie. La clave que
# usa es la MISMA publicable que va en el repositorio y que
# cualquiera ve en el navegador; se lee de `js/metas-docente-sync.js`
# para no tener dos sitios que digan lo mismo.
#
# ⚠️ Y van las DOS cabeceras, `apikey` y `Authorization: Bearer`,
# que es exactamente lo que manda la aplicación (mismo archivo,
# línea del `headers`). Con solo `apikey` la nube contesta **401**
# y el flujo falla: así salió la primera ejecución, el 9 de
# septiembre de 2026, y así habría seguido —fallando cada tres
# días y sin despertar nada— hasta febrero. La respuesta estaba
# en el archivo que este flujo ya abría.
#
# ⚠️ Y lo que esto NO resuelve, dicho aquí para que no sorprenda:
# GitHub apaga los `schedule` de un repositorio que lleve 60 días
# **sin un solo empujón**. Si el autor no toca el repositorio en
# dos meses, este archivo también se duerme. Hoy se publica casi a
# diario, así que no aplica; el día que aplique, la respuesta de
# verdad es el plan de pago (no se pausa y trae copias diarias),
# que es una decisión del autor y no de un archivo de flujo.
# ============================================================
name: Que la nube no se duerma

on:
  schedule:
    - cron: '17 12 */3 * *'   # cada tres días; el minuto 17 para no caer en la hora en punto, que va llena
  workflow_dispatch:

jobs:
  despertar:
    name: Tocar las dos nubes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Una lectura a cada nube, para que cuente como actividad
        run: |
          set -u
          # Las direcciones y las claves se LEEN del repositorio, para que no
          # haya dos sitios que digan lo mismo. Son las publicables: las que
          # cualquiera ve en el navegador.
          URL_A=$(grep -o "SB_URL_DEF = '[^']*'" js/metas-docente-sync.js | cut -d"'" -f2)
          KEY_A=$(grep -o "SB_KEY_DEF = '[^']*'" js/metas-docente-sync.js | cut -d"'" -f2)
          URL_B=$(grep -o "SB_URL = '[^']*'" js/metas-sugerencias.js | cut -d"'" -f2)
          KEY_B=$(grep -o "SB_KEY = '[^']*'" js/metas-sugerencias.js | cut -d"'" -f2)

          fallos=0

          tocar () {
            NOMBRE="$1"; URL="$2"; KEY="$3"
            if [ -z "$URL" ] || [ -z "$KEY" ]; then
              echo "✘ $NOMBRE: no se pudo leer la dirección o la clave del repositorio."
              echo "  Si esas constantes cambiaron de nombre, hay que corregir este flujo."
              fallos=$((fallos+1)); return
            fi
            echo "── $NOMBRE ── $URL"

            # 1) La lectura de siempre: la raíz de la API REST, con las DOS
            #    cabeceras que manda la aplicación. No toca ninguna tabla.
            R=$(curl -s -w '\n%{http_code}' --max-time 30 \
                  -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
                  "$URL/rest/v1/") || R=$'\n000'
            C=$(printf '%s' "$R" | tail -n1)
            B=$(printf '%s' "$R" | sed '$d' | head -c 200)
            echo "   /rest/v1/      → $C  $B"
            case "$C" in 2*) echo "   ✅ $NOMBRE despierta."; return ;; esac

            # 2) Si la API REST no le abre a la clave publicable —pasa, y lo
            #    que hace falta es que la petición LLEGUE al proyecto, no que
            #    devuelva datos—, vale la salud del servicio de cuentas, que
            #    no lleva clave y cuenta igual como actividad.
            C2=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/auth/v1/health")
            echo "   /auth/v1/health → $C2"
            case "$C2" in
              2*) echo "   ✅ $NOMBRE despierta (por la salud del servicio)." ; return ;;
            esac

            echo "   ✘ $NOMBRE no contestó a ninguna de las dos. Míralo antes de que se pause."
            fallos=$((fallos+1))
          }

          # La del maestro: sus aulas, sus notas y sus claves de familia.
          tocar "La nube de M.E.T.A.S" "$URL_A" "$KEY_A"
          # La de F.A.R.O: por ahí salen las sugerencias que escriben los
          # alumnos y por ahí entran los videos de las misiones. Si esta se
          # duerme, el alumno escribe su sugerencia y se queda en la cola sin
          # que nadie la lea, y la sección de videos dice que la nube no
          # contestó. Se toca desde aquí porque es desde AQUÍ desde donde se
          # la llama, aunque el panel viva en otro repositorio.
          tocar "La nube de F.A.R.O" "$URL_B" "$KEY_B"

          # Se FALLA a propósito: enterarse por un correo del CI cuesta un
          # minuto; enterarse en febrero, con el maestro delante, cuesta su
          # confianza.
          if [ "$fallos" -gt 0 ]; then exit 1; fi
