<div id="app"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   BUZÓN DEL LECTOR — la página que llena CUALQUIERA.

   La revista sale cada quince días o cada mes y hasta ahora la
   escribían solo sus cuatro redactores. Esta pantalla abre la otra puerta:
   quien la lee puede mandar una nota, una opinión, una denuncia o
   una sugerencia, y una escuela puede PEDIR que le cubran un
   evento en «Aulas en acción». Lo que se manda cae en la
   herramienta de Redacción, en su propia bandeja.

   El enlace va impreso en la revista, como código QR, y suelto en
   grupos de WhatsApp. De ahí salen las reglas de esta pantalla:

   1. NADA DE REGISTRARSE. Ni clave, ni cuenta, ni correo de
      confirmación. Quien tiene algo que contar lo cuenta hoy o no
      lo cuenta.
   2. NOMBRE Y TELÉFONO, SIEMPRE. No es burocracia: es lo que
      separa una nota de un anónimo. El teléfono no se publica
      nunca; sirve para llamar y confirmar antes de imprimir.
   3. LO QUE SE MANDA NO SE PIERDE. Si falla el internet, el envío
      queda guardado en este teléfono y se reintenta solo; y de
      paso se ofrece mandarlo por WhatsApp, ya escrito.
   4. SE PUEDE RETIRAR. Con el folio y el teléfono, quien se
      arrepiente borra lo suyo sin pedirle permiso a nadie. Una
      denuncia da miedo al día siguiente, y esa puerta tiene que
      existir de verdad, no en un párrafo de buenas intenciones.

   POR QUÉ ESTA PÁGINA VIVE EN M.E.T.A.S Y LOS DATOS SE VAN A
   OTRO SITIO: la aplicación de la revista es privada y está
   detrás de una puerta con contraseña, así que no puede recibir
   visitas de la calle. Esta página sí: es pública, tiene
   dirección propia y no nombra a la revista por ninguna parte
   —el enlace se reparte solo, y una pantalla que se presenta
   sola no obliga a explicar de quién es—. Los envíos se mandan
   por una única función del servidor que solo sabe ESCRIBIR: con
   esta clave no se puede leer nada de lo que hay dentro, ni
   contarlo, ni saber si existe.
   ═══════════════════════════════════════════════════════════════ */

/* El proyecto de la revista. La clave es «publicable»: va en el
   navegador porque así se diseña, y lo que la vuelve segura es que
   la seguridad por fila está cerrada y la única puerta abierta es
   la función de enviar. */
const SB_URL_DEF = 'https://bzrnjvalpwlcnpszvwim.supabase.co';
const SB_KEY_DEF = 'sb_publishable_74mJW5LoxPZOWtIi7YrBEw_0y9JjSfM';

/* La versión de los requisitos de ética que se acepta hoy. Se guarda
   con cada envío: si mañana cambian, la fila sigue diciendo cuáles
   firmó ESE lector, y un reclamo dentro de un año se puede resolver
   mirando el dato en vez de la memoria de alguien. */
const ETICA_VERSION = '2026-08';

const PEND_KEY = 'BUZON_PENDIENTE_V1';   /* lo que no se pudo mandar */
const MIOS_KEY = 'BUZON_MIOS_V1';        /* los folios de este teléfono */

const MAX_TEXTO = 4000;
const MIN_TEXTO = 20;
const MAX_FOTOS = 2;
const MAX_FOTO_B64 = 1400000;   /* el mismo tope que hace cumplir el servidor */

const $app = document.getElementById('app');

/* ── Las cinco puertas ─────────────────────────────────────────── */
const CLASES = [
  { id: 'nota', ic: '📝', t: 'Una nota o un dato',
    d: 'Algo que pasó y merece contarse.',
    guia: '¿Qué pasó, dónde y cuándo? ¿Quién estaba? Si sabe números (cuántos niños, cuánto costó), póngalos.' },
  { id: 'opinion', ic: '💬', t: 'Una opinión',
    d: 'Su carta al director, con su nombre.',
    guia: '¿De qué quiere hablar y qué piensa? Una idea clara vale más que tres a medias.' },
  { id: 'denuncia', ic: '⚠️', t: 'Una denuncia',
    d: 'Algo que está mal y debería saberse.', cls: 'puerta-denuncia',
    guia: '¿Qué está mal, desde cuándo y a quién le afecta? ¿Lo vio usted o se lo contaron? ¿Ya lo reportó a alguien y qué le dijeron?' },
  { id: 'sugerencia', ic: '💡', t: 'Una sugerencia',
    d: 'Para que la revista salga mejor.',
    guia: '¿Qué le gustaría leer, o qué le sobra? Diga también qué sección.' },
  { id: 'aulas', ic: '🏫', t: 'Que cubran mi escuela',
    d: 'Un evento para la sección Aulas en acción.', cls: 'puerta-aulas',
    guia: '¿Qué va a pasar, quién participa y por qué vale la pena contarlo? Diga también a quién buscar el día del evento.' },
];
const claseDe = id => CLASES.find(c => c.id === id) || CLASES[0];

/* ── Estado ────────────────────────────────────────────────────── */
let EDICION = null;      /* { numero, cierre } de la edición abierta */
let PASO = 'portada';
let B = nuevoBorrador();
/* Cuando NO es null, lo que hay en el formulario no es un envío nuevo:
   es la corrección de uno que ya está en la bandeja. Lleva su folio, su
   teléfono y cuántas fotos tenía, porque las fotos no se bajan para
   corregir una coma. */
let EDITANDO = null;

function nuevoBorrador() {
  return {
    clase: 'nota', titulo: '', texto: '',
    nombre: '', tel: '', correo: '', lugar: '', escuela: '', cargo: '',
    evento_fecha: '', evento_hora: '', evento_lugar: '',
    fotos: [], etica_ok: false, permiso_fotos: false,
  };
}

/* ── Utilidades ────────────────────────────────────────────────── */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function sbCfg() {
  let url = SB_URL_DEF, key = SB_KEY_DEF;
  try {
    url = localStorage.getItem('BUZON_SB_URL') || url;
    key = localStorage.getItem('BUZON_SB_KEY') || key;
  } catch (_) {}
  return { url, key };
}
async function rpc(fn, body) {
  const { url, key } = sbCfg();
  const r = await fetch(url + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'apikey': key, 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* Sin acentos ni signos: así «José Ángel» y «jose angel» son el
   mismo, y mandar dos veces lo mismo CORRIGE en vez de duplicar. */
function norm(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
function huella() {
  return (norm(B.nombre) + '|' + String(B.tel || '').replace(/\D/g, '') + '|' +
          norm(B.texto).slice(0, 60)).slice(0, 160);
}

/* ── Fechas ──────────────────────────────────────────────────────
   Se parten a mano porque new Date('2026-08-15') se lee en UTC y en
   Honduras enseña el día ANTERIOR. Un lector que lee mal el cierre
   manda tarde y su nota no entra. */
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
               'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function aFecha(iso) {
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function fechaLarga(iso) {
  const f = aFecha(iso);
  return f ? DIAS[f.getDay()] + ' ' + f.getDate() + ' de ' + MESES[f.getMonth()] : String(iso || '');
}
function diasHasta(iso) {
  const f = aFecha(iso);
  if (!f) return null;
  const h = new Date(); h.setHours(0, 0, 0, 0);
  return Math.round((f - h) / 86400000);
}
function isoDe(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
         '-' + String(d.getDate()).padStart(2, '0');
}
/* La quincena en curso, para cuando el servidor no contesta. La
   revista es quincenal: cierra el 15 y el último día del mes. */
function quincenaActual() {
  const h = new Date();
  const fin = h.getDate() <= 15
    ? new Date(h.getFullYear(), h.getMonth(), 15)
    : new Date(h.getFullYear(), h.getMonth() + 1, 0);
  return { numero: null, cierre: isoDe(fin) };
}

/* En el escritorio de Windows, WhatsApp corrompe los emojis que
   llegan por wa.me; WhatsApp Web los conserva. */
function waAbrir(texto, tel) {
  const enc = encodeURIComponent(texto);
  const movil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const t = String(tel || '').replace(/\D/g, '');
  window.open(movil
    ? 'https://wa.me/' + t + '?text=' + enc
    : 'https://web.whatsapp.com/send?' + (t ? 'phone=' + t + '&' : '') + 'text=' + enc, '_blank');
}
function enlaceMio() { return location.origin + location.pathname; }

/* ── Lo pendiente y lo mío ─────────────────────────────────────── */
function guardaPendiente(b) {
  // Con fotos puede no caber en el almacén del navegador (unos 5 MB).
  // Antes que perderlo todo, se guarda sin ellas y se dice: el texto
  // es lo que no se puede volver a escribir igual.
  try { localStorage.setItem(PEND_KEY, JSON.stringify(b)); return 'entero'; } catch (_) {}
  try {
    localStorage.setItem(PEND_KEY, JSON.stringify(Object.assign({}, b, { fotos: [] })));
    return 'sin-fotos';
  } catch (_) { return 'no'; }
}
function leePendiente() {
  try { return JSON.parse(localStorage.getItem(PEND_KEY)) || null; } catch (_) { return null; }
}
function borraPendiente() { try { localStorage.removeItem(PEND_KEY); } catch (_) {} }
function apuntaMio(folio, clase) {
  try {
    const l = JSON.parse(localStorage.getItem(MIOS_KEY)) || [];
    if (!l.some(x => x.folio === folio)) l.unshift({ folio, clase, cuando: Date.now() });
    localStorage.setItem(MIOS_KEY, JSON.stringify(l.slice(0, 20)));
  } catch (_) {}
}

/* ── Fotos ───────────────────────────────────────────────────────
   Se achican AQUÍ, en el teléfono, antes de mandarlas. Una foto de
   cámara moderna pesa cinco megas y por el internet de un pueblo no
   sube nunca: el lector ve la rueda girar, se cansa y se va. 1600
   píxeles es de sobra para imprimir a ancho de columna. */
function achicaFoto(archivo) {
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onerror = () => reject(new Error('no se pudo leer'));
    lector.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('no es una imagen'));
      img.onload = () => {
        let lado = 1600;
        let datos = '';
        // Se baja de tamaño y de calidad hasta que entra en el tope.
        // El tope lo hace cumplir también el servidor; aquí se cumple
        // por adelantado para no gastarle los datos al lector en un
        // envío que va a ser rechazado.
        for (let intento = 0; intento < 5; intento++) {
          const escala = Math.min(1, lado / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.width * escala));
          c.height = Math.max(1, Math.round(img.height * escala));
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          datos = c.toDataURL('image/jpeg', intento === 0 ? 0.78 : 0.78 - intento * 0.12);
          if (datos.length <= MAX_FOTO_B64) return resolve(datos);
          lado = Math.round(lado * 0.75);
        }
        reject(new Error('la foto es demasiado grande'));
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}

/* ═════════ PANTALLA: la portada ═════════ */

  else if (dias === 1) cuenta = '<div class="hero-cuenta urge">⏰ Mañana se cierra la próxima revista</div>';
  else if (dias != null && dias > 0 && dias <= 4) cuenta = '<div class="hero-cuenta urge">⏰ Faltan ' + dias + ' días para el cierre</div>';
  else cuenta = '<div class="hero-cuenta">🗓️ La próxima cierra el ' + esc(fechaLarga(cierre)) + '</div>';

  $app.innerHTML = `

function opcional() { return '<span style="font-weight:600;color:var(--suave)">(si quiere)</span>'; }

function pintaCuenta() {
  const el = document.getElementById('f-cuenta');
  if (!el) return;

  el.textContent = n < MIN_TEXTO ? `Escriba al menos ${MIN_TEXTO} letras` : `${n} de ${MAX_TEXTO}`;
  el.classList.toggle('corto', n < MIN_TEXTO);
}

function pintaFotos() {
  const cont = document.getElementById('f-fotos');
  if (!cont) return;
  cont.innerHTML =
    B.fotos.map((f, i) => `
      <div class="foto">
        <img src="${f}" alt="Foto ${i + 1}">
        <button type="button" class="foto-x" data-quitar="${i}" aria-label="Quitar esta foto">✕</button>
      </div>`).join('') +
    (B.fotos.length < MAX_FOTOS
      ? `<button type="button" class="foto-add" id="f-add"><span>＋</span>${B.fotos.length ? 'Otra' : 'Añadir foto'}</button>`
      : '');

  cont.querySelectorAll('[data-quitar]').forEach(b => b.addEventListener('click', () => {
    B.fotos.splice(Number(b.dataset.quitar), 1);
    if (!B.fotos.length) B.permiso_fotos = false;
    pintaFotos();
  }));
  const add = document.getElementById('f-add');
  const inp = document.getElementById('f-file');
  if (add && inp) add.addEventListener('click', () => inp.click());
}

/* El selector de archivos es UNO y vive en la pantalla, no se crea al
   vuelo en cada toque: así se puede probar de verdad (una prueba no
   puede meterle un archivo a un elemento que no existe hasta que
   alguien toca) y así no se acumulan selectores sueltos si el lector
   se arrepiente tres veces. */
function ligaSelectorDeFotos() {
  const inp = document.getElementById('f-file');
  if (!inp) return;
  inp.addEventListener('change', async () => {
    const archivo = inp.files && inp.files[0];
    // El valor se limpia en cuanto se tiene el archivo: sin esto,
    // elegir DOS VECES la misma foto no dispara nada y parece que la
    // aplicación se colgó.
    if (!archivo) return;
    const add = document.getElementById('f-add');
    if (add) { add.disabled = true; add.innerHTML = '<span>⏳</span>Achicando'; }
    try {
      if (B.fotos.length < MAX_FOTOS) B.fotos.push(await achicaFoto(archivo));
    } catch (_) {
      alert('No se pudo usar esa foto. Pruebe con otra.');
    }
    inp.value = '';
    pintaFotos();
  });
}

/* ═════════ Enviar ═════════ */
async function enviar(desdePendiente) {
  const $b = document.getElementById('e-enviar');
  if ($b) { $b.disabled = true; $b.textContent = '⏳ Mandando…'; }

  const cuerpo = {
    p_huella: huella(), p_clase: B.clase,
    p_titulo: String(B.titulo || '').trim(), p_texto: String(B.texto || '').trim(),
    p_nombre: String(B.nombre || '').trim(), p_tel: String(B.tel || '').trim(),
    p_correo: String(B.correo || '').trim(), p_lugar: String(B.lugar || '').trim(),
    p_escuela: String(B.escuela || '').trim(), p_cargo: String(B.cargo || '').trim(),
    p_evento_fecha: B.evento_fecha || null,
    p_evento_hora: String(B.evento_hora || '').trim(),
    p_evento_lugar: String(B.evento_lugar || '').trim(),
    p_etica_ok: !!B.etica_ok, p_etica_version: ETICA_VERSION,
    p_permiso_fotos: !!B.permiso_fotos,
    p_fotos: B.fotos,
  };

  // Corrigiendo, va por otra puerta: la que cambia la fila que YA está
  // en la bandeja en vez de crear otra. Y va por folio, no por huella:
  // la huella lleva dentro el principio del texto, y corregir el texto
  // es justo lo que la cambia.
  if (EDITANDO) {
    let r = 'error';
    try {
      r = String(await rpc('faro_buzon_editar', {
        p_folio: EDITANDO.folio, p_tel: EDITANDO.tel, p_huella: cuerpo.p_huella,
        p_clase: cuerpo.p_clase, p_titulo: cuerpo.p_titulo, p_texto: cuerpo.p_texto,
        p_nombre: cuerpo.p_nombre, p_correo: cuerpo.p_correo, p_lugar: cuerpo.p_lugar,
        p_escuela: cuerpo.p_escuela, p_cargo: cuerpo.p_cargo,
        p_evento_fecha: cuerpo.p_evento_fecha, p_evento_hora: cuerpo.p_evento_hora,
        p_evento_lugar: cuerpo.p_evento_lugar,
        p_etica_version: ETICA_VERSION, p_permiso_fotos: cuerpo.p_permiso_fotos,
        p_fotos_cambiar: !!EDITANDO.cambiarFotos, p_fotos: B.fotos,
      }) || 'error');
    } catch (_) { r = 'sin-red'; }

    if (r === 'ok') { verGracias(EDITANDO.folio, true); return; }
    // Un «no» del servidor no es un fallo de red: guardar y ofrecer
    // WhatsApp aquí sería mentirle. Se le dice qué pasó y qué hacer.
    if (r !== 'sin-red') { verNoSePudo(r); return; }
    verFallo(guardaPendiente(Object.assign({}, B, { cuando: Date.now() })), desdePendiente);
    return;
  }

  let folio = '';
  try { folio = String((await rpc('faro_buzon_enviar', cuerpo)) || ''); } catch (_) { folio = ''; }

  if (folio) {
    borraPendiente();
    apuntaMio(folio, B.clase);
    verGracias(folio);
    return;
  }
  // No llegó. Se guarda para reintentar y se ofrece la salida por
  // WhatsApp: un lector que cree que mandó algo y no, es una nota
  // perdida que nadie va a echar de menos porque nadie sabe que existió.
  const guardado = guardaPendiente(Object.assign({}, B, { cuando: Date.now() }));
  verFallo(guardado, desdePendiente);
}

/* El servidor dijo que no, y no por falta de red. Cada motivo lleva
   su explicación y su salida: dejarlo en un «no se pudo» pelado es
   abandonar a alguien delante de una pantalla que no le dice qué
   hacer. */
function verNoSePudo(motivo) {
  const M = {
    atendido: {
      ic: '📰', t: 'Ya no se puede cambiar',
      p: 'Alguien lo leyó, lo comprobó y lo puso en una edición de la revista. Si hay algo que corregir, dígaselo a quien le llamó: todavía hay tiempo antes de imprimir.',
    },
    descartado: {
      ic: '🤝', t: 'Este ya no está en juego',
      p: 'Esta vez no entró, así que no hay nada que corregir. Si quiere contarlo de otra manera, mande uno nuevo: no molesta.',
    },
    tope: {
      ic: '✏️', t: 'Ya lo corrigió muchas veces',
      p: 'Diez correcciones son bastantes. Si todavía hace falta otra, retírelo y mándelo de nuevo entero.',
    },
    'no-existe': {
      ic: '🔍', t: 'No lo encontré',
      p: 'Ese folio con ese teléfono no me sale. Revise que sean los mismos que usó al mandarlo.',
    },
  };
  const m = M[motivo] || {
    ic: '😕', t: 'No se pudo guardar',
    p: 'Algo salió mal por el camino. Su texto sigue en la pantalla anterior: pruebe otra vez.',
  };
  $app.innerHTML = `
    <div class="wrap">
      <div class="gracias">
        <div class="gracias-ic">${m.ic}</div>
        <h2>${esc(m.t)}</h2>
        <p>${esc(m.p)}</p>
        <div class="botones">
          <button class="btn btn-1" id="n-volver">‹ Volver a lo que escribí</button>
          <button class="btn btn-sec" id="n-buzon">Ir al buzón</button>
        </div>
      </div>
    </div>`;
  document.getElementById('n-volver').addEventListener('click', verFormulario);
  document.getElementById('n-buzon').addEventListener('click', () => { EDITANDO = null; verPortada(); });
}

/* Lo que el lector le manda a quien le pasó el enlace, si el
   internet falló: lo mismo que iba a mandar, ya escrito. */
function textoRespaldo() {
  const c = claseDe(B.clase);
  return c.ic + ' *' + c.t.toUpperCase() + ' — para la revista*\n' +
    (B.titulo ? '*' + B.titulo + '*\n' : '') + '\n' +
    B.texto + '\n\n' +
    '👤 ' + B.nombre + (B.cargo ? ' (' + B.cargo + ')' : '') + '\n' +
    '📞 ' + B.tel + '\n' +
    (B.lugar ? '📍 ' + B.lugar + '\n' : '') +
    (B.escuela ? '🏫 ' + B.escuela + '\n' : '') +
    (B.clase === 'aulas' && B.evento_fecha ? '🗓️ ' + fechaLarga(B.evento_fecha) +
      (B.evento_hora ? ' · ' + B.evento_hora : '') + '\n' : '') +
    (B.fotos.length ? '\n(Van ' + B.fotos.length + ' foto' + (B.fotos.length === 1 ? '' : 's') +
      ' aparte: se mandan por WhatsApp desde la galería.)\n' : '') +
    '\n_Se mandó desde el buzón del lector, pero no había internet._';
}

/* ═════════ La tarjeta del folio, para la galería ═════════
   Un folio en pantalla se pierde en cuanto se cierra la pestaña, y sin
   él el lector no puede corregir ni retirar lo suyo: la promesa de que
   puede arrepentirse se queda en el aire. Apuntarlo en un papel es
   pedirle demasiado a quien está de pie en un pasillo con el teléfono
   en la mano.

   Así que se le da hecho: una imagen con su folio, su teléfono y la
   dirección, que se guarda en la galería como una foto más y aparece
   ahí el día que la necesite. */
function dibujaTarjeta(folio, tel, clase, fechaISO) {
  const W = 1080, H = 1250;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  const centro = (t, y, fuente, color) => {
    x.font = fuente; x.fillStyle = color; x.textAlign = 'center';
    x.fillText(t, W / 2, y);
  };
  // Los renglones se MIDEN antes de pintar nada, y por eso está partido
  // en dos: primero cuántos salen, después se dibujan. Hacerlo del
  // tirón obliga a adivinar cuánto va a ocupar un texto para poder
  // pintar el recuadro de detrás, y el teléfono de cada quien tiene un
  // largo distinto. Se adivinó una vez y el aviso del final se salió
  // de su caja y se comió el pie de la tarjeta.
  const partir = (t, ancho, fuente) => {
    x.font = fuente;
    const palabras = String(t).split(' ');
    const salida = [];
    let linea = '';
    for (const p of palabras) {
      const prueba = linea ? linea + ' ' + p : p;
      if (x.measureText(prueba).width > ancho && linea) { salida.push(linea); linea = p; }
      else { linea = prueba; }
    }
    if (linea) salida.push(linea);
    return salida;
  };
  const parrafo = (t, y, ancho, alto, fuente, color) => {
    const ls = partir(t, ancho, fuente);
    x.fillStyle = color; x.textAlign = 'center';
    ls.forEach((l, i) => x.fillText(l, W / 2, y + i * alto));
    return y + ls.length * alto;
  };

  x.fillStyle = '#f0fdfa'; x.fillRect(0, 0, W, H);

  const g = x.createLinearGradient(0, 0, W, 300);
  g.addColorStop(0, '#0f766e'); g.addColorStop(1, '#14b8a6');
  x.fillStyle = g; x.fillRect(0, 0, W, 300);
  centro('📬', 130, '90px sans-serif', '#ffffff');
  centro('BUZÓN DEL LECTOR', 210, 'bold 40px sans-serif', 'rgba(255,255,255,.92)');
  centro('Su comprobante', 265, '34px sans-serif', 'rgba(255,255,255,.85)');

  // El folio, tan grande como quepa: es lo único que hay que leer de
  // un vistazo dentro de una galería llena de fotos.
  x.fillStyle = '#ffffff';
  x.fillRect(70, 360, W - 140, 230);
  x.strokeStyle = '#5eead4'; x.lineWidth = 6;
  x.strokeRect(70, 360, W - 140, 230);
  centro('SU FOLIO', 425, 'bold 34px sans-serif', '#0f766e');
  centro(folio, 540, 'bold 130px sans-serif', '#0f766e');

  let y = 665;
  centro('Su teléfono: ' + tel, y, 'bold 44px sans-serif', '#1f2937');
  y = parrafo(
    'Guarde esta imagen. Con el folio y su teléfono puede CORREGIR o RETIRAR lo que mandó.',
    y + 70, W - 180, 52, '40px sans-serif', '#374151');

  y = parrafo('metas.policastsapien.com/buzon.html', y + 40, W - 120, 50,
    'bold 40px sans-serif', '#0f766e');

  // El aviso que hace falta y que nadie pone: esta imagen ES la llave.
  // Quien la tenga puede borrar lo que este lector mandó, y si lo que
  // mandó era una denuncia, eso importa.
  const AVISO = '⚠️ No la comparta: con estos datos, cualquiera podría retirar lo que usted mandó.';
  const lineas = partir(AVISO, W - 200, '34px sans-serif');
  const altoCaja = lineas.length * 48 + 60;
  x.fillStyle = '#fef3c7';
  x.fillRect(70, y + 40, W - 140, altoCaja);
  parrafo(AVISO, y + 40 + 55, W - 200, 48, '34px sans-serif', '#92400e');

  centro((claseDe(clase).t) + ' · ' + fechaLarga(fechaISO), H - 50, '32px sans-serif', '#6b7280');
  return c;
}

/* Guardarla. En el teléfono, lo que de verdad la mete en la galería es
   el menú de compartir (ahí sale «Guardar imagen» / «Guardar en
   Fotos»); una descarga normal la deja en la carpeta de Descargas, que
   no es donde la va a buscar. Se intenta lo primero y, si el navegador
   no lo trae, se descarga. Y pase lo que pase la imagen queda pintada
   en la pantalla, porque mantener el dedo encima y «Guardar imagen»
   funciona siempre y en todos. */
async function guardarTarjeta(folio, tel, clase) {
  const lienzo = dibujaTarjeta(folio, tel, clase, isoDe(new Date()));
  const nombre = 'buzon-' + folio + '.png';
  const blob = await new Promise(r => lienzo.toBlob(r, 'image/png'));
  if (!blob) return 'no';

  try {
    const archivo = new File([blob], nombre, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
      await navigator.share({ files: [archivo], title: 'Mi folio del buzón' });
      return 'compartido';
    }
  } catch (e) {
    // Si lo cancela él, no es un fallo: no hay que ofrecerle nada más.
    if (e && e.name === 'AbortError') return 'compartido';
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    return 'descargado';
  } catch (_) { return 'no'; }
}

function textoCompartir() {
  return '📬 *Buzón del lector*\n' +
    'Si pasó algo que merece contarse —o algo que está mal y debería saberse—\n' +
    'aquí se manda a la revista, desde el teléfono y sin registrarse 👇\n' + enlaceMio();
}

/* ═════════ PANTALLA: lo que ya mandó ═════════ */
/* La puerta de vuelta, y hace dos cosas que se parecen y no son lo
   mismo: CORREGIR (cambia el envío que ya está, conserva su folio y su
   sitio en la cola) y RETIRAR (lo borra del todo). Antes solo existía
   la segunda, y quien se equivocaba en un dato tenía que borrarlo y
   escribirlo entero otra vez. Mandarlo de nuevo tampoco servía: la
   llave contra el doble toque lleva dentro el principio del texto, así
   que en cuanto se cambia la primera línea entra como envío nuevo y en
   la bandeja aparecen dos casi iguales.

   Las dos piden lo mismo, que es lo único que solo tiene quien lo
   mandó: su folio y su teléfono. */
function verMio(folio, tel, err) {
  PASO = 'mio';
  $app.innerHTML = `
    <div class="hero" style="padding:18px 18px 22px">
      <div class="hero-ic" style="font-size:40px">📄</div>
      <h1 style="font-size:21px">Lo que ya mandó</h1>
      <div class="hero-sub">Para corregirlo o para retirarlo. Hace falta el folio que le dimos.</div>
    </div>
    <div class="wrap">
      <div class="card">
        <div class="campo">
          <label for="r-fol">Su folio</label>
          <input class="inp" id="r-fol" value="${esc(folio || '')}" maxlength="12"
                 placeholder="B-7K3M" autocapitalize="characters" autocomplete="off"
                 style="letter-spacing:3px;font-weight:900;text-transform:uppercase">
          <div class="pista">Se lo dimos al mandarlo. Si lo perdió, escríbale a quien le pasó el enlace.</div>
        </div>
        <div class="campo" style="margin-bottom:0">
          <label for="r-tel">El teléfono con el que lo mandó</label>
          <input class="inp" id="r-tel" value="${esc(tel || '')}" maxlength="30"
                 placeholder="9999-8888" inputmode="tel">
        </div>
      </div>
      <div class="err" id="r-err">${esc(err || '')}</div>
      <div class="botones">
        <button class="btn btn-1" id="r-go">Buscarlo</button>
        <button class="volver" id="r-volver">‹ Volver</button>
      </div>
    </div>`;
  document.getElementById('r-volver').addEventListener('click', verPortada);
  document.getElementById('r-go').addEventListener('click', () => {
    const f = document.getElementById('r-fol').value.trim().toUpperCase();
    const t = document.getElementById('r-tel').value.trim();
    if (f.length < 4 || String(t).replace(/\D/g, '').length < 8) {
      document.getElementById('r-err').textContent = 'Hacen falta el folio y el teléfono, los dos.';
      return;
    }
    abrirMio(f, t);
  });
}

/* Lo trae y lo enseña, con lo que se puede hacer con él. */
async function abrirMio(folio, tel) {
  $app.innerHTML = '<div class="centro"><div class="gr">📄</div><p>Buscándolo…</p></div>';
  let m = null;
  try {
    const filas = await rpc('faro_buzon_mio', { p_folio: folio, p_tel: tel });
    if (Array.isArray(filas) && filas.length) m = filas[0];
  } catch (_) {
    verMio(folio, tel, 'No hay internet. Conéctese y pruebe otra vez.');
    return;
  }
  if (!m) {
    verMio(folio, tel, 'No encontré nada con ese folio y ese teléfono. Revise que sean los mismos que usó.');
    return;
  }

  const c = claseDe(m.clase);
  // Al lector se le dice en qué punto está lo suyo, con palabras suyas.
  // «atendido» no es una palabra que signifique nada para él: lo que
  // significa es que ya está preparándose para salir.
  const COMO_VA = {
    nuevo:      { ic: '📬', t: 'Está en el buzón, sin abrir todavía.' },
    leido:      { ic: '👀', t: 'Ya lo leyó alguien de la redacción.' },
    atendido:   { ic: '📰', t: 'Ya se está preparando para un número de la revista.' },
    descartado: { ic: '🤝', t: 'Esta vez no entró.' },
  };
  const va = COMO_VA[m.estado] || COMO_VA.nuevo;

  $app.innerHTML = `
    <div class="hero" style="padding:18px 18px 22px">
      <div class="hero-ic" style="font-size:40px">${c.ic}</div>
      <h1 style="font-size:21px">${esc(c.t)}</h1>
      <div class="hero-sub">Folio ${esc(folio)} · mandado el ${esc(fechaLarga(String(m.creado_at || '').slice(0, 10)))}</div>
    </div>
    <div class="wrap">
      <div class="aviso ${m.se_puede ? 'aviso-ok' : ''}" style="margin-top:14px">
        ${va.ic} <strong>${esc(va.t)}</strong>
        ${m.editado_at ? '<br>✏️ Usted ya lo corrigió una vez.' : ''}
      </div>

      <div class="card">
        ${m.titulo ? `<div class="card-t">${esc(m.titulo)}</div>` : ''}
        <p style="font-size:14.5px;white-space:pre-wrap">${esc(String(m.texto || '').slice(0, 600))}${String(m.texto || '').length > 600 ? '…' : ''}</p>
        ${m.fotos ? `<div class="pista" style="margin-top:10px">📷 Con ${m.fotos} foto${m.fotos === 1 ? '' : 's'}.</div>` : ''}
      </div>

      ${m.se_puede ? `
      <div class="botones">
        <button class="btn btn-1" id="m-editar">✏️ Corregirlo</button>
        <button class="btn btn-sec" id="m-retirar">🗑️ Retirarlo del todo</button>
        <button class="volver" id="m-volver">‹ Volver al buzón</button>
      </div>` : `
      <div class="aviso">
        ${m.estado === 'atendido'
          ? 'Ya no se puede cambiar: alguien lo leyó, lo comprobó y lo puso en una edición. Si hay algo que corregir, dígaselo a quien le llamó — todavía hay tiempo antes de imprimir.'
          : m.estado === 'descartado'
            ? 'Esta vez no entró, así que no hay nada que corregir. Si quiere contarlo de otra manera, mande uno nuevo: no molesta.'
            : 'Lo ha corregido ya muchas veces. Si hace falta otra, mejor retírelo y mándelo de nuevo entero.'}
      </div>
      <div class="botones">
        <button class="btn btn-sec" id="m-retirar">🗑️ Retirarlo del todo</button>
        <button class="volver" id="m-volver">‹ Volver al buzón</button>
      </div>`}
    </div>`;

  document.getElementById('m-volver').addEventListener('click', verPortada);
  document.getElementById('m-retirar').addEventListener('click', () => retirarMio(folio, tel));
  const bEd = document.getElementById('m-editar');
  if (bEd) bEd.addEventListener('click', () => {
    // Lo suyo vuelve al mismo formulario con el que lo escribió. Las
    // fotos NO bajan: pesan casi un mega y casi nadie las cambia al
    // corregir una frase. Se le pregunta si las deja o las cambia.
    B = Object.assign(nuevoBorrador(), {
      clase: m.clase, titulo: m.titulo || '', texto: m.texto || '',
      nombre: m.nombre || '', tel: m.tel || tel, correo: m.correo || '',
      lugar: m.lugar || '', escuela: m.escuela || '', cargo: m.cargo || '',
      evento_fecha: m.evento_fecha || '', evento_hora: m.evento_hora || '',
      evento_lugar: m.evento_lugar || '',
      permiso_fotos: !!m.fotos,
    });
    EDITANDO = { folio, tel, fotosAntes: Number(m.fotos) || 0, cambiarFotos: false };
    verFormulario();
  });
}

async function retirarMio(folio, tel) {
  if (!confirm('¿Retirarlo del todo?\n\nSe borra con sus fotos y nadie de la redacción lo vuelve a ver. No se puede deshacer.')) return;
  let ok = false;
  try { ok = (await rpc('faro_buzon_retirar', { p_folio: folio, p_tel: tel })) === true; } catch (_) { ok = false; }
  if (!ok) { verMio(folio, tel, 'No se pudo retirar. Pruebe otra vez.'); return; }
  EDITANDO = null;
  $app.innerHTML = `
    <div class="centro">
      <div class="gr">✅</div>
      <h2>Retirado</h2>
      <p>Ya no está. Si algún día quiere contarlo otra vez, el buzón sigue aquí.</p>
      <div class="botones" style="max-width:320px;margin:18px auto 0">
        <button class="btn btn-1" id="rr-volver">Volver al buzón</button>
      </div>
    </div>`;
  document.getElementById('rr-volver').addEventListener('click', verPortada);
}

/* ═════════ Arranque ═════════ */
async function arrancar() {
  $app.innerHTML = '<div class="centro"><div class="gr">📬</div><p>Abriendo el buzón…</p></div>';
  // La fecha de cierre es lo único que se le pregunta al servidor, y
  // si no contesta no pasa nada: la revista es quincenal y la quincena
  // se calcula aquí. Un buzón que no abre porque falló una consulta
  // de adorno es un buzón cerrado.
  try {
    const filas = await rpc('faro_buzon_estado', {});
    if (Array.isArray(filas) && filas.length) EDICION = filas[0];
  } catch (_) {}
  const q = new URLSearchParams(location.search);
  if (q.has('retirar') || q.has('mio')) verMio();
  else verPortada();
}
arrancar();
</script>
