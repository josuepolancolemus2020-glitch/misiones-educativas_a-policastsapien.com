# Configuración de GitHub Pages (que construye el sitio con Jekyll).
#
# Nació para sacar `www/` del sitio publicado: era la copia que se llevaba
# Capacitor a la app de Android, iba muy atrasada y estaba siendo alcanzable
# en /www/index.html. Un teléfono que abriera esa dirección se instalaba el
# service worker VIEJO en su propio ámbito y se quedaba con la aplicación de
# hace meses, sin forma de enterarse. La copia vieja (`www/`, `android/`) se
# retiró en noviembre de 2026, pero la exclusión se queda: cuando la app se
# monte de nuevo (_dev/ANDROID-IOS-PLAN.md), sus copias tampoco son el sitio.
#
# `node_modules/` y `_dev/` se van por lo mismo: son del árbol de trabajo, no
# del sitio.
#
# Desde la limpieza de noviembre de 2026 también se van los documentos de
# trabajo: `_privado/` (SQL de Supabase, auditorías, propuestas, manuales),
# `docs/` (el historial de normativas) y las guías del repositorio
# (CLAUDE.md, README.md). Jekyll ya ignora lo que empieza por «.» o «_»; se
# escriben igual para que esta lista diga entera qué no es el sitio, y para
# que coincida con `.assetsignore`, que es la de Cloudflare.
exclude:
  - www/
  - android/
  - node_modules/
  - _dev/
  - _privado/
  - docs/
  - .claude/
  - .idea/
  - CLAUDE.md
  - README.md
