<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abriendo misión · M.E.T.A.S.</title>
  <script>
    (function () {
      try {
        var ruta = (window.location.pathname || '') + (window.location.search || '') + (window.location.hash || '');
        if (/prebasica|libro1/i.test(ruta)) {
          var destino = '/misiones/prebasica-tecnicas-libro1/prebasica-libro1.html' + (window.location.search || '') + (window.location.hash || '');
          if (window.history && typeof window.history.replaceState === 'function') {
            window.history.replaceState(null, '', destino);
          }
          fetch('/misiones/prebasica-tecnicas-libro1/prebasica-libro1.html', { cache: 'no-cache' })
            .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
            .then(function (html) {
              document.open();
              document.write(html);
              document.close();
            })
            .catch(function () {
              window.location.href = destino;
            });
        }
      } catch (e) {}
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1526;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.25rem;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 1.75rem 1.4rem;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 0.6rem;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 0.5rem;
      color: #ffffff;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #cbd5e1;
      margin: 0 0 1.25rem;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 0.9rem 1rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.98rem;
      text-decoration: none;
      margin-bottom: 0.65rem;
    }
    .btn-primary {
      background: #16a34a;
      color: #ffffff;
    }
    .btn-secondary {
      background: #2563eb;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🐝</div>
    <h1>M.E.T.A.S. · Portal Educativo</h1>
    <p>Selecciona a dónde deseas ingresar:</p>
    <a class="btn btn-primary" href="/misiones/prebasica-tecnicas-libro1/prebasica-libro1.html">
      👉 Abrir Misión Prebásica (Libro 1)
    </a>
    <a class="btn btn-secondary" href="/index.html">
      🏠 Ir al Inicio de M.E.T.A.S.
    </a>
  </div>
</body>
</html>
