<script>
/* ═══════════════════════════════════════════════════════════════
   SALIDA — la página que contesta el PADRE.

   El maestro manda este enlace al grupo de WhatsApp de la escuela
   entera y necesita un número: cuánta gente va, para contratar los
   buses antes de pagarlos. Todo lo demás se le quitó.

   Tres reglas que explican cada decisión de esta pantalla:

   1. NADA DE REGISTRARSE. El enlace cae en un grupo con padres de
      todos los grados; muchos no tienen clave de familia y no la van
      a pedir un domingo. Por eso el padre escribe a mano el nombre
      del alumno y toca su grado.
   2. LA RESPUESTA NO SE PIERDE. Si falla el internet, la misma
      respuesta sale por WhatsApp al maestro, ya escrita. Un padre que
      contestó y no llegó es un asiento pagado de más.
   3. SE PUEDE CORREGIR. La huella (nombre + grado) hace que volver a
      contestar CAMBIE la respuesta en vez de contarla dos veces.
      Contar doble es justo lo que hace pagar un bus de sobra.
   4. QUIEN CONTESTA SE LLEVA ALGO. Un «gracias» se olvida; un BOLETO
      con folio, no. Es lo que la madre enseña en el portón y lo que el
      maestro le entrega impreso al recibir el aporte.
   ═══════════════════════════════════════════════════════════════ */

const SB_URL_DEF = 'https://uljjgrikyigdrkbikcxo.supabase.co';
const SB_KEY_DEF = 'sb_publishable_VGj7He4XL8AGscsY3RsxGg__xlzi48w';
const MIA_KEY = 'METAS_SALIDA_V1';       /* lo que YO contesté, por código */

const $app = document.getElementById('app');

let CODIGO = '';
let EV = null;          /* datos del evento */
let CUENTA = { familias: 0, personas: 0 };
let YO = null;          /* mi respuesta guardada en este teléfono */
let BORRADOR = { va: 1, alumno: '', grado: '', seccion: '', personas: 1, tel: '', nota: '' };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function sbCfg() {
  let url = SB_URL_DEF, key = SB_KEY_DEF;
  try {
    url = localStorage.getItem('METAS_SB_URL') || url;
    key = localStorage.getItem('METAS_SB_KEY') || key;
  } catch (_) {}
  return { url, key };
}
async function rpc(fn, body) {
  const { url, key } = sbCfg();
  const r = await fetch(url + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'apikey': key, 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function limpiarCodigo(v) { return String(v || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase(); }

/* ── Cómo se escribe un grupo ──
   6º-1 es «sexto grado, sección 1». Nunca «6 1» (dos números sueltos)
   ni «61» (parece sesenta y uno). La regla manda en toda la plataforma
   y vive en adGradoSeccion (js/tools/registros-admin.js); esta página
   es autónoma —no carga ese archivo— y lleva su propia copia. Si
   cambia una, cambia la otra: la madre y el maestro tienen que leer
   lo mismo. */
function grupoTxt(grado, seccion) {
  const g = String(grado || '').trim();
  const s = String(seccion || '').trim();
  if (!g) return s;
  const go = /^\d+$/.test(g) ? g + 'º' : g;
  if (!s) return go;
  return (go.length <= 4 && s.length <= 3) ? go + '-' + s : go + ' ' + s;
}
/* Sin acentos ni signos: así «José Ángel» y «jose angel» son el mismo niño */
function norm(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
function huella() {
  return huellaDe(BORRADOR.alumno, BORRADOR.grado, BORRADOR.seccion);
}
function huellaDe(alumno, grado, seccion) {
  return (norm(alumno) + '|' + norm(grado) + '|' + norm(seccion)).slice(0, 120);
}

/* ── El folio del boleto ──
   ⚠️ REGLA DE DOS ARCHIVOS: esto tiene que dar EXACTAMENTE lo mismo que
   convFolio/convHuella de js/tools/convocatoria.js. El maestro imprime
   el boleto desde allá y la madre lo lleva desde aquí: si las dos
   cuentas se separan, los dos papeles no son el mismo y el niño se
   queda discutiendo en el portón. Si cambia una, cambia la otra.

   No se pide a la nube a propósito: se saca de lo que las dos pantallas
   ya tienen (el código y la huella). Así sale igual en los dos lados,
   sirve sin internet y no hubo que tocar el servidor. */
const FOLIO_ALFA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';   /* sin 0/O/1/I/L: se dictan por teléfono */
function folioDe(codigo, hue) {
  const s = String(codigo || '') + '|' + String(hue || '');
  let h = 0x811c9dc5;                     /* FNV-1a de 32 bits */
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  let n = h % 923521, out = '';           /* 31⁴ */
  for (let i = 0; i < 4; i++) { out = FOLIO_ALFA[n % 31] + out; n = Math.floor(n / 31); }
  return String(codigo || '') + '-' + out;
}
function miFolio() {
  return YO ? folioDe(CODIGO, huellaDe(YO.alumno, YO.grado, YO.seccion)) : '';
}

/* ── Fechas: se parten a mano porque new Date('2026-08-15') se lee en
   UTC y en Honduras eso enseña el día ANTERIOR. Un padre que lee el
   día equivocado no llega. ── */
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
               'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function aFecha(iso) {
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function fechaLarga(iso) {
  const f = aFecha(iso);
  if (!f) return String(iso || '');
  return DIAS[f.getDay()] + ' ' + f.getDate() + ' de ' + MESES[f.getMonth()];
}
function diasHasta(iso) {
  const f = aFecha(iso);
  if (!f) return null;
  const h = new Date(); h.setHours(0, 0, 0, 0);
  return Math.round((f - h) / 86400000);
}
function horaTxt(hhmm) {
  const m = String(hhmm || '').match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return '';
  const h = +m[1];
  return ((h % 12) || 12) + ':' + m[2] + ' ' + (h < 12 ? 'a. m.' : 'p. m.');
}
/* ── El instante exacto en que se cierra ──
   Sin hora se cierra al ACABAR el día, no al empezarlo: si «11 de
   agosto» se tomara como las 00:00, ese mismo día 11 la madre que iba a
   contestar se encuentra el reloj en cero y la lista cerrada. */
function cierreMs(e) {
  const f = aFecha(e.limite);
  if (!f) return null;
  const m = String(e.limiteHora || '').match(/^(\d{1,2}):(\d{2})$/);
  if (m) f.setHours(+m[1], +m[2], 0, 0);
  else f.setHours(23, 59, 59, 999);
  return f.getTime();
}
function estaCerrada(e) {
  if (String(e.cerrada || '') === '1') return true;
  const ms = cierreMs(e);
  return ms != null && Date.now() > ms;
}
function dinero(n) {
  const v = Number(n) || 0;
  return 'L ' + v.toLocaleString('es-HN');
}

/* ── Lo que este teléfono ya contestó ── */
function leerMia() {
  try {
    const o = JSON.parse(localStorage.getItem(MIA_KEY));
    return (o && typeof o === 'object' && o[CODIGO]) ? o[CODIGO] : null;
  } catch (_) { return null; }
}
function guardarMia(r) {
  try {
    let o = {};
    try { o = JSON.parse(localStorage.getItem(MIA_KEY)) || {}; } catch (_) {}
    o[CODIGO] = r;
    localStorage.setItem(MIA_KEY, JSON.stringify(o));
  } catch (_) {}
}

/* En el escritorio de Windows, WhatsApp corrompe los emojis que llegan
   por wa.me; WhatsApp Web los conserva. Igual que en las misiones. */
function waAbrir(texto, tel) {
  const enc = encodeURIComponent(texto);
  const movil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const t = String(tel || '').replace(/\D/g, '');
  const url = movil
    ? 'https://wa.me/' + t + '?text=' + enc
    : 'https://web.whatsapp.com/send?' + (t ? 'phone=' + t + '&' : '') + 'text=' + enc;
  window.open(url, '_blank');
}
function enlaceMio() {
  return location.origin + location.pathname + '?c=' + CODIGO;
}

/* ═════════ PANTALLA: pedir el código ═════════ */
function verCodigo(err) {
  $app.innerHTML = `
    <div class="centro">
      <div class="gr">🚌</div>
      <h2>¿Cuál es el código?</h2>
      <p>${esc(err || 'El maestro le mandó un enlace. Si solo tiene el código, escríbalo aquí.')}</p>
      <div class="cod-row">
        <input class="cod-inp" id="c-inp" maxlength="8" placeholder="R4TP" autocomplete="off" autocapitalize="characters">
        <button class="btn btn-2" id="c-go" style="width:auto;padding:14px 18px">Ver</button>
      </div>
    </div>`;
  const go = async () => {
    const c = limpiarCodigo(document.getElementById('c-inp').value);
    if (c.length < 4) { verCodigo('El código tiene al menos 4 letras o números.'); return; }
    CODIGO = c;
    await cargar();
  };
  document.getElementById('c-go').addEventListener('click', go);
  document.getElementById('c-inp').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

/* ── El reloj que baja ──
   Se pinta ENTERO de una vez y después late cada segundo. Ese orden
   importa: si el primer dibujo se dejara al primer tic, el padre vería
   un hueco durante un segundo justo donde va lo que tiene que
   empujarlo, y en un teléfono lento más de uno.

   Al llegar a cero no se queda en «00:00:00»: se vuelve a pintar la
   pantalla, que ya se encuentra la lista cerrada. Un reloj en cero con
   el botón de contestar todavía debajo es una promesa que el servidor
   va a romper. */
let RELOJ = 0;
function pararReloj() { if (RELOJ) { clearInterval(RELOJ); RELOJ = 0; } }
function relojHtml(e) {
  const ms = cierreMs(e);
  if (ms == null) return '';
  return `<div class="reloj" id="reloj"><div class="reloj-t" id="reloj-t"></div>
    <div class="reloj-c" id="reloj-c"></div></div>`;
}
function pintaReloj(e) {
  const $r = document.getElementById('reloj');
  if (!$r) return;
  const ms = cierreMs(e);
  const falta = ms - Date.now();
  if (falta <= 0) { pararReloj(); verPortada(); return; }
  /* Hacia arriba, no hacia abajo: si faltan tres días clavados tiene
     que leerse «3 días 00:00:00», no «2 días 23:59:59». El cero llega
     cuando de verdad se acabó el plazo y no un segundo antes. */
  const seg = Math.ceil(falta / 1000);
  const d = Math.floor(seg / 86400), h = Math.floor((seg % 86400) / 3600);
  const mi = Math.floor((seg % 3600) / 60), s = seg % 60;
  const dd = n => String(n).padStart(2, '0');
  /* Con menos de un día los «00 días» solo estorban: fuera la caja y
     todo el reloj se pone rojo. */
  const urge = falta < 86400000;
  $r.className = 'reloj' + (urge ? ' urge' : '');
  document.getElementById('reloj-t').textContent = urge
    ? '⏰ Últimas horas para contestar'
    : '⏳ Se cierra la lista en';
  document.getElementById('reloj-c').innerHTML =
    (urge ? '' : `<div class="reloj-b"><b>${d}</b><span>DÍA${d === 1 ? '' : 'S'}</span></div>`) +
    `<div class="reloj-b"><b>${dd(urge ? h + d * 24 : h)}</b><span>HORAS</span></div>` +
    `<div class="reloj-b"><b>${dd(mi)}</b><span>MIN</span></div>` +
    `<div class="reloj-b"><b>${dd(s)}</b><span>SEG</span></div>`;
}
function arrancaReloj(e) {
  pararReloj();
  if (cierreMs(e) == null) return;
  pintaReloj(e);
  RELOJ = setInterval(() => pintaReloj(e), 1000);
}

/* ── Cuántos se ven confirmados ──
   Los que contestaron MÁS el arranque que puso el maestro (`arranque`),
   que es la gente que ya le dijo que sí de palabra o por WhatsApp y
   nunca va a tocar el enlace. Sin eso, el primero que abre la
   invitación se encuentra un cero, entiende que la salida no va a salir
   y se espera «a ver si se llena» — y como todos hacen lo mismo, no se
   llena nunca.

   Lo que el maestro usa para contratar los buses NO lleva esta suma:
   son las respuestas de verdad, y eso se calcula en su pantalla
   (convTotales), no aquí. */
function confirmados() {
  const arr = Math.max(0, Number(EV.arranque) || 0);
  return { personas: CUENTA.personas + arr, familias: CUENTA.familias + Math.ceil(arr / 2) };
}

/* ═════════ Enviar ═════════ */
/* Se llama desde DOS pantallas: la del formulario y la de gracias (el
   botón «probar otra vez» cuando falló el internet). Por eso no da por
   sentado que los campos del formulario sigan en la pantalla: cuando el
   padre reintenta ya no están, y darlos por hechos rompía justo el
   camino que existe para no perder su respuesta. */
async function enviar() {
  const $err = document.getElementById('f-err');
  const $b = document.getElementById('f-enviar');
  const decir = m => { if ($err) $err.textContent = m; };
  BORRADOR.alumno = String(BORRADOR.alumno || '').trim();
  BORRADOR.seccion = String(BORRADOR.seccion || '').trim();
  if (BORRADOR.alumno.length < 3) { decir('👆 Escriba el nombre del alumno.'); return; }
  if (!BORRADOR.grado) { decir('👆 Toque el grado en el que va.'); return; }
  decir('');
  if ($b) { $b.disabled = true; $b.textContent = '⏳ Mandando…'; }
  const yaContaba = !!(YO && YO.subida && YO.va);

  const cuerpo = {
    p_codigo: CODIGO, p_huella: huella(), p_va: BORRADOR.va === 1,
    p_alumno: BORRADOR.alumno, p_grado: BORRADOR.grado, p_seccion: BORRADOR.seccion,
    p_personas: BORRADOR.va === 1 ? BORRADOR.personas : 0,
    p_tel: String(BORRADOR.tel || '').trim(), p_nota: String(BORRADOR.nota || '').trim(),
  };
  let ok = false;
  try { ok = (await rpc('metas_conv_responder', cuerpo)) === true; } catch (_) { ok = false; }

  YO = {
    va: BORRADOR.va === 1, alumno: BORRADOR.alumno, grado: BORRADOR.grado,
    seccion: BORRADOR.seccion, personas: BORRADOR.va === 1 ? BORRADOR.personas : 0,
    tel: BORRADOR.tel, nota: BORRADOR.nota, subida: ok ? 1 : 0,
  };
  guardarMia(YO);
  if (ok && YO.va && !yaContaba) { CUENTA.familias++; CUENTA.personas += YO.personas; }
  verGracias(ok);
}

        <h2>${YO.va ? '¡Listo, asiento apartado!' : 'Gracias por contestar'}</h2>

            : '❌ Esta vez no va' + (YO.nota ? ' — ' + esc(YO.nota) : '')}</div>
        </div>

        ${!ok ? `
        <div class="aviso">

        </div>
        <div class="botones">
          <button class="btn btn-wa" id="g-wa">📲 Mandarla por WhatsApp</button>
          <button class="btn btn-sec" id="g-reintentar">🔄 Probar otra vez con internet</button>
        </div>` : (YO.va ? `
        ${boletoHtml(e)}
        <div class="botones" style="margin-top:12px">
          <button class="btn btn-2" id="g-guardar">📷 Guardar el boleto en mi galería</button>
        </div>
        <div class="pie" id="g-guardar-msg" style="padding-top:6px"></div>
        <div id="g-boleto-img" style="display:none;margin-top:10px">
          <img id="g-boleto-png" alt="Su boleto" style="width:100%;max-width:340px;border-radius:14px;border:2px solid var(--borde)">
          <p class="pie" style="padding-top:6px">Mantenga el dedo encima de la imagen y elija «Guardar imagen».</p>
        </div>

        <div class="card" style="text-align:left">
          <div class="card-t">Lo que sigue</div>
          <ul class="pasos">
            <li><span class="n">1</span><span>${Number(e.aporte) > 0
              ? 'Mande el aporte de <strong>' + esc(total) + '</strong> esta semana. ' + esc(e.cobro || 'Con el maestro o con el alumno.')
              + ' El maestro le devuelve su <strong>boleto impreso</strong>: ese es el recibo.'
              : 'No hay que pagar nada.'}</span></li>
            <li><span class="n">2</span><span>El <strong>${esc(fechaLarga(e.fecha))}</strong>${e.hora ? ', a las <strong>' + esc(e.hora) + '</strong>,' : ''}
              esté en ${esc(e.punto || 'la escuela')} con el boleto. El bus <strong>no espera</strong>.</span></li>
            <li><span class="n">3</span><span>${esc(e.nota || 'Lleve agua y lo que su hijo vaya a necesitar en el día.')}</span></li>
          </ul>
        </div>
        <div class="botones">
          <button class="btn btn-si" id="g-compartir">↗️ Avisarle a otro papá o mamá</button>
          ${e.wa ? '<button class="btn btn-sec" id="g-wa-maestro">💬 Tengo una pregunta para el maestro</button>' : ''}
        </div>` : `
        <div class="botones">
          <button class="btn btn-sec" id="g-compartir">↗️ Pasarle el enlace a otro papá o mamá</button>
        </div>`)}

        <button class="volver" id="g-volver">‹ Ver los datos de la salida otra vez</button>
      </div>
      <p class="pie">${esc(e.escuela || '')}${e.escuela ? ' · ' : ''}Hecho con
        <a href="https://metas.policastsapien.com" target="_blank" rel="noopener">M.E.T.A.S</a></p>
    </div>`;

  const bWa = document.getElementById('g-wa');
  if (bWa) bWa.addEventListener('click', () => waAbrir(textoRespuesta(), e.wa));
  const bRe = document.getElementById('g-reintentar');
  if (bRe) bRe.addEventListener('click', async () => {
    bRe.disabled = true; bRe.textContent = '⏳ Probando…';
    await enviar();
  });
  const bGua = document.getElementById('g-guardar');
  if (bGua) bGua.addEventListener('click', async () => {
    bGua.disabled = true; bGua.textContent = '⏳ Preparando…';
    const r = await guardarBoleto();
    /* La imagen se enseña SIEMPRE, salga como salga el guardado: es la
       salida que funciona en todos los teléfonos, sin depender de que
       el navegador traiga el menú de compartir. */
    document.getElementById('g-boleto-png').src = dibujaBoleto().toDataURL('image/png');
    document.getElementById('g-boleto-img').style.display = 'block';
    bGua.disabled = false; bGua.textContent = '📷 Guardar el boleto en mi galería';
    document.getElementById('g-guardar-msg').textContent =
      r === 'compartido' ? 'Elija «Guardar imagen» o «Guardar en Fotos».'
      : r === 'descargado' ? 'Se descargó. Búsquelo en sus Descargas, o guárdelo desde la imagen de abajo.'
      : 'Guárdelo desde la imagen de abajo.';
    document.getElementById('g-boleto-img').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  const bComp = document.getElementById('g-compartir');
  if (bComp) bComp.addEventListener('click', () => waAbrir(textoCompartir()));
  const bWaM = document.getElementById('g-wa-maestro');
  if (bWaM) bWaM.addEventListener('click', () =>
    waAbrir('Buenas, soy el encargado de ' + YO.alumno + '. Le escribo por «' + (EV.titulo || 'la salida') + '».', e.wa));
  document.getElementById('g-volver').addEventListener('click', verPortada);
}

/* ═════════ El boleto, para la galería ═════════
   Un boleto que solo vive en una pestaña se pierde en cuanto se cierra,
   y con él el folio. Guardado como foto aparece el sábado por la mañana
   entre las fotos del teléfono, que es justo cuando hace falta. Es el
   mismo camino que el folio del Buzón, y por la misma razón. */
function dibujaBoleto() {
  const e = EV, W = 1080;
  const c = document.createElement('canvas');
  c.width = W; c.height = 100;
  const x = c.getContext('2d');
  /* Los renglones se MIDEN antes de pintar nada, y por eso está partido
     en dos: primero cuántos salen, después se dibujan. Hacerlo del
     tirón obliga a adivinar cuánto va a ocupar un texto —el título lo
     escribe el maestro y puede ser de tres palabras o de doce— y ya
     pasó: el aviso del final se salió de su caja y se comió el renglón
     de «válido para 3 personas». */
  const partir = (t, ancho, fuente) => {
    x.font = fuente;
    const salida = []; let linea = '';
    for (const p of String(t).split(' ')) {
      const prueba = linea ? linea + ' ' + p : p;
      if (x.measureText(prueba).width > ancho && linea) { salida.push(linea); linea = p; }
      else { linea = prueba; }
    }
    if (linea) salida.push(linea);
    return salida;
  };

  const ap = Number(e.aporte) || 0;
  const lTit = partir(e.titulo || 'Salida educativa', W - 120, 'bold 46px sans-serif');
  const AVISO = ap
    ? 'Enséñeselo al maestro con el aporte: él le entrega el boleto impreso, que es el recibo y el pase para subir.'
    : 'Enseñe este boleto el día de la salida para subir al bus.';
  const lAviso = partir(AVISO, W - 200, '32px sans-serif');
  const lPunto = e.punto ? partir('Se sube en ' + e.punto, W - 160, '34px sans-serif') : [];

  /* Cada bloque sabe dónde empieza porque el de arriba ya se midió. */
  const yFecha = 200 + lTit.length * 56 + 14;
  const altoCab = yFecha + 34;
  const yNom = altoCab + 92;
  const yGrupo = yNom + 56;
  const cajaY = yGrupo + 40, cajaH = 220;
  const yVale = cajaY + cajaH + 66;
  const yPunto = yVale + 48;
  const avisoY = yPunto + lPunto.length * 44 + 26;
  const avisoH = lAviso.length * 44 + 56;
  const H = avisoY + avisoH + 90;

  c.height = H;                       /* cambiar el alto BORRA el lienzo: se pinta después */
  const centro = (t, y, fuente, color) => {
    x.font = fuente; x.fillStyle = color; x.textAlign = 'center';
    x.fillText(t, W / 2, y);
  };
  const bloque = (ls, y, alto, fuente, color) => {
    x.font = fuente; x.fillStyle = color; x.textAlign = 'center';
    ls.forEach((l, i) => x.fillText(l, W / 2, y + i * alto));
  };

  x.fillStyle = '#fff7ed'; x.fillRect(0, 0, W, H);
  const g = x.createLinearGradient(0, 0, W, altoCab);
  g.addColorStop(0, '#ea580c'); g.addColorStop(1, '#f59e0b');
  x.fillStyle = g; x.fillRect(0, 0, W, altoCab);
  centro('🎟️', 120, '84px sans-serif', '#ffffff');
  bloque(lTit, 200, 56, 'bold 46px sans-serif', '#ffffff');
  centro(fechaLarga(e.fecha) + (e.hora ? ' · ' + e.hora : ''), yFecha,
    '34px sans-serif', 'rgba(255,255,255,.95)');

  centro(YO.alumno, yNom, 'bold 54px sans-serif', '#1f2937');
  centro(grupoTxt(YO.grado, YO.seccion), yGrupo, 'bold 40px sans-serif', '#c2410c');

  /* El folio, tan grande como quepa: es lo único que el maestro va a
     buscar en su lista cuando la madre le enseñe la foto. */
  x.fillStyle = '#ffffff'; x.fillRect(70, cajaY, W - 140, cajaH);
  x.strokeStyle = '#fed7aa'; x.lineWidth = 6; x.strokeRect(70, cajaY, W - 140, cajaH);
  centro('FOLIO DEL BOLETO', cajaY + 62, 'bold 32px sans-serif', '#c2410c');
  centro(miFolio(), cajaY + 172, 'bold 106px monospace', '#9a3412');

  centro('Válido para ' + YO.personas + ' persona' + (YO.personas === 1 ? '' : 's') +
    (ap ? ' · ' + dinero(ap * YO.personas) : ' · sin costo'), yVale, 'bold 40px sans-serif', '#1f2937');
  bloque(lPunto, yPunto, 44, '34px sans-serif', '#4b5563');

  x.fillStyle = '#fef3c7'; x.fillRect(70, avisoY, W - 140, avisoH);
  bloque(lAviso, avisoY + 52, 44, '32px sans-serif', '#92400e');
  centro((e.escuela || '') + (e.escuela ? ' · ' : '') + 'M.E.T.A.S', H - 42, '30px sans-serif', '#6b7280');
  return c;
}

/* En el teléfono, lo que de verdad mete la imagen en la galería es el
   menú de compartir; una descarga normal la deja en Descargas, que no es
   donde la va a buscar. Se intenta lo primero y, si no está, se
   descarga. Igual que en el Buzón. */
async function guardarBoleto() {
  const blob = await new Promise(r => dibujaBoleto().toBlob(r, 'image/png'));
  if (!blob) return 'no';
  const nombre = 'boleto-' + miFolio() + '.png';
  try {
    const archivo = new File([blob], nombre, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
      await navigator.share({ files: [archivo], title: 'Mi boleto' });
      return 'compartido';
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return 'compartido';   /* lo canceló él: no es un fallo */
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    return 'descargado';
  } catch (_) { return 'no'; }
}

/* ═════════ Arranque ═════════ */
function verError(msg) {
  pararReloj();
  $app.innerHTML = `
    <div class="centro">
      <div class="gr">📭</div>
      <h2>No pude abrir la invitación</h2>
      <p>${esc(msg)}</p>
      <div class="botones" style="max-width:320px;margin:18px auto 0">
        <button class="btn btn-2" id="e-otra">🔄 Intentar otra vez</button>
        <button class="btn btn-sec" id="e-cod">Escribir el código a mano</button>
      </div>
    </div>`;
  document.getElementById('e-otra').addEventListener('click', cargar);
  document.getElementById('e-cod').addEventListener('click', () => verCodigo());
}

async function cargar() {
  $app.innerHTML = '<div class="centro"><div class="gr">🚌</div><p>Abriendo la invitación…</p></div>';
  try {
    const filas = await rpc('metas_conv_ver', { p_codigo: CODIGO });
    if (!Array.isArray(filas) || !filas.length) {
      verError('No encontré ninguna salida con el código ' + CODIGO + '. Revise el enlace que le pasaron.');
      return;
    }
    EV = filas[0].datos || {};
    CUENTA = { familias: filas[0].familias || 0, personas: filas[0].personas || 0 };
    YO = leerMia();
    if (YO) BORRADOR = Object.assign({}, BORRADOR, YO, { va: YO.va ? 1 : 0 });
    document.title = (EV.titulo ? EV.titulo + ' — ' : '') + '¿Va su hijo?';
    verPortada();
  } catch (_) {
    verError('Parece que no hay internet. Conéctese y toque «Intentar otra vez».');
  }
}

CODIGO = limpiarCodigo(new URLSearchParams(location.search).get('c') || location.hash.replace('#', ''));
if (CODIGO.length >= 4) cargar(); else verCodigo();
