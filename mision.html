<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a7c">
  <title>Misión — M.E.T.A.S.</title>
  <link rel="manifest" href="manifest.json">
  <!-- Las tipografías, aquí dentro: antes venían de fonts.googleapis.com por un
       @import de app.css, y una hoja de estilo externa BLOQUEA el pintado. Con el
       CDN colgado —lo que hace la señal de un pueblo— la portada no pintaba NUNCA.
       Va antes de app.css para que el @font-face esté cuando la hoja lo pida. -->
  <link rel="stylesheet" href="css/vendor/fuentes/fuentes.css?v=462">
  <link rel="stylesheet" href="css/app.css?v=553">

  <!-- El tamaño de letra del maestro se aplica ANTES del primer pintado:
       si se aplicara al final, vería la pantalla pequeña y luego un salto,
       y en un teléfono lento ese salto le mueve de debajo del dedo lo que
       iba a tocar. Misma razón por la que estrella-ganada.js va aquí. -->
  <script src="js/letra-maestro.js?v=462"></script>
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <!-- Esta página es una puerta: recibe ?m=<carpeta> y lleva a la misión.
       Mientras decide no pinta nada, para que quien trae un enlace bueno no
       vea un aviso de error un instante antes de entrar. Si no trae ?m=, no
       hay nada que esperar y el aviso sale de una vez. -->
  <script>if (/[?&]m=[^&]/.test(location.search)) document.documentElement.classList.add('abriendo');</script>
  <style>
    body { overflow-y: auto; }
    .abriendo .aviso { visibility: hidden; }
    .aviso {
      max-width: 420px;
      margin: 0 auto;
      padding: 64px 20px;
      text-align: center;
    }
    .aviso-icono { font-size: 3rem; line-height: 1; margin: 0 0 16px; }
    .aviso h1 { font-size: 1.4rem; font-weight: 800; color: var(--text); margin: 0 0 10px; }
    .aviso p { font-size: 1rem; line-height: 1.5; color: var(--muted); margin: 0 0 28px; }
    /* Un solo botón: aquí no hay nada más que hacer que ir a elegir una misión. */
    .aviso-boton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 28px;
      border-radius: 14px;
      background: var(--brand);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
    }
    .aviso-boton:hover { opacity: .9; }
    .aviso-boton:focus-visible { outline: 3px solid var(--brand-light); outline-offset: 3px; }
  </style>
</head>
<body>

  <main class="aviso" id="aviso">
    <p class="aviso-icono" aria-hidden="true">🧭</p>
    <h1>No encontramos esa misión</h1>
    <p id="aviso-texto">Este enlace no dice qué misión abrir.</p>
    <a class="aviso-boton" id="aviso-boton" href="index.html">Ver todas las misiones</a>
  </main>

  <!-- Si alguno de estos archivos no llega (señal mala), el aviso se muestra
       igual: lo que no puede pasar es quedarse en blanco para siempre. -->
  <script src="js/data/misiones.js?v=485" onerror="document.documentElement.classList.remove('abriendo')"></script>
  <script src="js/catalogo-misiones.js?v=485" onerror="document.documentElement.classList.remove('abriendo')"></script>
  <!-- Las misiones del maestro no están en el catálogo del alumno: tienen el
       suyo aquí. Se carga para que ?m=docente-… también abra. -->
  <script src="js/tools/formacion-docente.js?v=506" onerror="document.documentElement.classList.remove('abriendo')"></script>
  <script src="js/metas-centro.js?v=562" onerror="document.documentElement.classList.remove('abriendo')"></script>
  <script src="js/motor-misiones.js?v=547" onerror="document.documentElement.classList.remove('abriendo')"></script>
  <script>MotorMisiones.abrirPedida();</script>
</body>
</html>
