<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14833b">
  <title>Asistente para madres y padres — M.E.T.A.S</title>
  <meta name="description" content="Consulte con la clave de su familia cómo va su hijo o hija: notas, mensajes del maestro y consejos para apoyar en casa.">
  <meta property="og:title" content="🤖 Asistente M.E.T.A.S para madres y padres">
  <meta property="og:description" content="Escriba la clave de su familia y pregunte: ¿cómo va mi hijo?, ¿qué sacó?, ¿cómo lo ayudo en casa?">
  <meta property="og:image" content="https://metas.policastsapien.com/img/icon-512.png">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">

  <style>
    :root {
      --verde: #14833b;
      --verde-osc: #0d5f2a;
      --verde-claro: #e6f6ec;
      --tinta: #1c2733;
      --muted: #5b6b7b;
      --fondo: #eef3ee;
      --blanco: #ffffff;
      --burbuja-padre: #d7f0dd;
      --ok: #1e8e3e;
      --baja: #c0392b;
      --borde: #d5dfd8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--fondo);
      color: var(--tinta);
      display: flex; flex-direction: column;
      height: 100dvh;
    }
    /* ── Encabezado ── */
    header {
      background: var(--verde); color: #fff;
      padding: 12px 14px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      flex: 0 0 auto;
    }
    .h-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex: 0 0 auto;
    }
    .h-txt { min-width: 0; }
    .h-t1 { font-size: 16px; font-weight: 800; line-height: 1.2; }
    .h-t2 { font-size: 12px; opacity: .92; }
    .h-inicio {
      margin-left: auto; flex: 0 0 auto;
      color: #fff; text-decoration: none; font-size: 12px; font-weight: 700;
      background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.45);
      padding: 7px 10px; border-radius: 999px;
    }
    /* ── Zona de chat ── */
    #chat {
      flex: 1 1 auto; overflow-y: auto;
      padding: 14px 12px 8px;
      -webkit-overflow-scrolling: touch;
    }
    .msg { display: flex; margin-bottom: 10px; }
    .msg.bot { justify-content: flex-start; }
    .msg.yo  { justify-content: flex-end; }
    .bub {
      max-width: 86%;
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 16px; line-height: 1.5;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
      word-wrap: break-word; overflow-wrap: break-word;
    }
    .bot .bub { background: var(--blanco); border-bottom-left-radius: 5px; }
    .yo  .bub { background: var(--burbuja-padre); border-bottom-right-radius: 5px; }
    .bub a { color: var(--verde-osc); font-weight: 700; word-break: break-all; }
    .bub strong { color: var(--verde-osc); }
    /* Tarjeta de nota dentro de una burbuja */
    .nota-card {
      background: var(--verde-claro); border: 1px solid var(--borde);
      border-radius: 10px; padding: 8px 10px; margin-top: 8px;
      font-size: 15px;
    }
    .nota-card .nc-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .nota-card .nc-eval { font-weight: 700; }
    .nota-card .nc-val { font-weight: 900; white-space: nowrap; }
    .nota-card .nc-val.ok  { color: var(--ok); }
    .nota-card .nc-val.baja{ color: var(--baja); }
    .nota-card .nc-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .msj-maestro {
      background: #fff8e6; border-left: 4px solid #e6a817;
      border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 15px;
    }
    /* «Escribiendo…» */
    .typing .bub { color: var(--muted); font-style: italic; }
    /* ── Chips de respuesta rápida ── */
    #chips {
      flex: 0 0 auto;
      display: flex; flex-wrap: nowrap; gap: 7px;
      padding: 6px 12px 8px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; white-space: nowrap;
      background: var(--blanco); color: var(--verde-osc);
      border: 1.6px solid var(--verde);
      border-radius: 999px; padding: 9px 13px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: transform .12s;
    }
    .chip:active { transform: scale(.95); background: var(--verde-claro); }
    /* ── Entrada ── */
    #barra {
      flex: 0 0 auto;
      display: flex; gap: 8px;
      padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
      background: var(--blanco); border-top: 1px solid var(--borde);
    }
    #inp {
      flex: 1; border: 1.6px solid var(--borde); border-radius: 999px;
      padding: 12px 16px; font-size: 16px; outline: none; min-width: 0;
    }
    #inp:focus { border-color: var(--verde); }
    #enviar {
      flex: 0 0 auto; width: 50px; height: 50px; border-radius: 50%;
      background: var(--verde); color: #fff; border: none;
      font-size: 20px; cursor: pointer;
    }
    #enviar:active { background: var(--verde-osc); }
  </style>
</head>

  <header>
    <div class="h-avatar">🤖</div>

      <div class="h-t1">Asistente para madres y padres</div>
      <div class="h-t2">M.E.T.A.S — responde con las notas reales de su hijo/a</div>

  <div id="chat" aria-live="polite"></div>

    <input id="inp" type="text" autocomplete="off" placeholder="Escriba su pregunta o la clave…">
    <button id="enviar" aria-label="Enviar">➤</button>
  </div>

<script>
/* ============================================================
   ASISTENTE DE PADRES — bot de reglas, sin costo y sin cuentas.
   Lee la nube con la RPC metas_consultar_plan_padre usando la
   clave de la familia (nº de lista + 4 letras, ej. 15-K7QM) que
   entrega el maestro en tiras impresas. Guarda la última consulta
   en el teléfono para poder releerla sin internet.
   ============================================================ */

const SB_URL_DEF = 'https://uljjgrikyigdrkbikcxo.supabase.co';
const SB_KEY_DEF = 'sb_publishable_VGj7He4XL8AGscsY3RsxGg__xlzi48w';
const PADRE_KEY  = 'METAS_PADRE_V1';        // misma clave que usa la vista Padre del index
const CACHE_KEY  = 'METAS_PADRE_CACHE_V1';  // última consulta exitosa (para releer offline)

const $chat  = document.getElementById('chat');
const $chips = document.getElementById('chips');
const $inp   = document.getElementById('inp');

let ROWS = null;          // filas del plan de acción (o null)
let ROWS_AD = null;       // filas administrativas: asistencia/notas finales/economía
let ROWS_AV = null;       // comunicados del maestro: avisos/eventos/materiales/cuentas/faq
let ROWS_FECHA = null;    // cuándo se consultaron
let ROWS_CACHE = false;   // true si vienen del respaldo local

/* ── utilidades ── */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function norm(s) {
  return String(s || '').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}
/* Chat-speak y errores comunes al escribir («q debe mi ijo», «como ba»):
   se expanden palabra por palabra DESPUÉS de norm, para que las reglas
   trabajen siempre con español estándar. */
const EXPAND = {
  q: 'que', k: 'que', ke: 'que', xq: 'porque', xk: 'porque', pq: 'porque',
  porq: 'porque', porke: 'porque', devo: 'debo', deve: 'debe', deven: 'deben',
  ba: 'va', ban: 'van', ijo: 'hijo', ija: 'hija', ijos: 'hijos',
  mijo: 'mi hijo', mija: 'mi hija', ay: 'hay', tmb: 'tambien', tb: 'tambien',
  dnd: 'donde', qnd: 'cuando', cdo: 'cuando', cundo: 'cuando', kuanto: 'cuanto',
  qanto: 'cuanto', wenas: 'buenas', grasias: 'gracias', asta: 'hasta',
  aser: 'hacer', ase: 'hace', asen: 'hacen', orario: 'horario',
  sako: 'saco', kiero: 'quiero', nesesito: 'necesito',
  maistro: 'maestro', maextro: 'maestro', aprovo: 'aprobo', reprovo: 'reprobo',
};
function expand(t) {
  return String(t || '').split(' ').map(w => EXPAND[w] || w).join(' ');
}
function fmtFecha(iso) {
  /* fecha pura (2026-07-11): NO pasarla por Date — en Honduras (UTC-6)
     mostraría el día anterior */
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return m[3] + '/' + m[2] + '/' + m[1];
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return String(d.getDate()).padStart(2, '0') + '/' +
         String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
}
function pctDe(r) {
  if (r.nsp || typeof r.nota !== 'number') return null;
  const base = (typeof r.base === 'number' && r.base > 0) ? r.base : 100;
  return Math.round((r.nota / base) * 100);
}
/* Convierte URLs del mensaje del maestro en enlaces tocables */
function linkify(txtEscapado) {
  return txtEscapado.replace(/(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function cfgLoad() {
  try { const o = JSON.parse(localStorage.getItem(PADRE_KEY)); return (o && typeof o === 'object') ? o : {}; }
  catch (_) { return {}; }
}
function cfgSave(c) { try { localStorage.setItem(PADRE_KEY, JSON.stringify(c)); } catch (_) {} }
/* Caché POR CÓDIGO: cada hijo/a conserva su propio respaldo offline.
   Migra solo el formato viejo (una sola familia por teléfono). */
function _cacheTodo() {
  try {
    const o = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (!o || typeof o !== 'object') return {};
    if (o.codigo && o.rows !== undefined) {   /* formato viejo */
      const m = {}; m[o.codigo] = { t: o.t, rows: o.rows, admin: o.admin, avisos: o.avisos };
      return m;
    }
    return o;
  } catch (_) { return {}; }
}
function cacheLoad(codigo) { return _cacheTodo()[codigo] || null; }
function cacheSave(codigo, rows, admin, avisos) {
  try {
    const o = _cacheTodo();
    o[codigo] = { t: new Date().toISOString(), rows, admin, avisos };
    localStorage.setItem(CACHE_KEY, JSON.stringify(o));
  } catch (_) {}
}
/* Varios hijos en el mismo teléfono: cfg.codigos = [{codigo, alias}];
   cfg.codigo sigue siendo el ACTIVO (compatibilidad con la vista Padre) */
function cfgCodigos() {
  const c = cfgLoad();
  if (Array.isArray(c.codigos) && c.codigos.length) return c.codigos;
  if (c.codigo) { c.codigos = [{ codigo: c.codigo, alias: '' }]; cfgSave(c); return c.codigos; }
  return [];
}
function aliasDe(codigo) {
  const e = cfgCodigos().find(x => x.codigo === codigo);
  return (e && e.alias) ? e.alias : '';
}
function claveGuardada() { return String(cfgLoad().codigo || ''); }
function claveBonita(c)  { return String(c || '').replace(/^(\d+)/, '$1-'); }
/* ¿El texto parece una clave de familia? (nº de lista + 4-6 letras/números) */
function pareceClave(txt) {
  const limpio = String(txt || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  return /^\d{1,3}[A-Z2-9]{4,6}$/.test(limpio) ? limpio : '';
}
/* ¿CASI una clave? (trae 0, 1, I, L u O: caracteres que nunca usamos) */
function casiClave(txt) {
  const limpio = String(txt || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  const m = limpio.match(/^\d{1,3}([A-Z0-9]{4,6})$/);
  return (m && /[01ILO]/.test(m[1])) ? limpio : '';
}

/* ── burbujas ── */
function userSay(txt) {
  const div = document.createElement('div');
  div.className = 'msg yo';
  div.innerHTML = '<div class="bub">' + esc(txt) + '</div>';
  $chat.appendChild(div);
  $chat.scrollTop = $chat.scrollHeight;
}
let _typingEl = null;
function botTyping() {
  _typingEl = document.createElement('div');
  _typingEl.className = 'msg bot typing';
  _typingEl.innerHTML = '<div class="bub">escribiendo…</div>';
  $chat.appendChild(_typingEl);
  $chat.scrollTop = $chat.scrollHeight;
}
function botSay(html, chips) {
  return new Promise(res => {
    botTyping();
    setTimeout(() => {
      if (_typingEl) { _typingEl.remove(); _typingEl = null; }
      const div = document.createElement('div');
      div.className = 'msg bot';
      div.innerHTML = '<div class="bub">' + html + '</div>';
      $chat.appendChild(div);
      if (chips) pintarChips(chips);
      $chat.scrollTop = $chat.scrollHeight;
      res();
    }, 420);
  });
}
function pintarChips(lista) {
  $chips.innerHTML = '';
  (lista || []).forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = c;
    b.addEventListener('click', () => { userSay(c); manejar(c); });
    $chips.appendChild(b);
  });
}
const CHIPS_BASE = ['📊 ¿Cómo va?', '📣 Avisos', '📝 Última nota', '📚 Todas las notas',
                    '🗓 ¿Faltó a clases?', '🧮 Boleta del parcial', '💰 Pagos y colectas',
                    '🙂 Conducta', '🏠 ¿Cómo ayudo en casa?', '💡 Consejo de hoy',
                    '🔄 Actualizar', '🔑 Cambiar clave'];
/* Con más de una clave guardada aparece el conmutador de hijos */
function chipsMenu() {
  return cfgCodigos().length > 1 ? ['👧 Cambiar de hijo'].concat(CHIPS_BASE) : CHIPS_BASE;
}

/* ── tarjetas de nota ── */
function notaCardHTML(r) {
  const esNSP = !!r.nsp;
  const p = pctDe(r);
  const val = esNSP ? 'NSP' : (r.nota == null ? '—' : r.nota + '/' + (r.base || 100));
  const ok = p !== null && p >= 70;
  const formaTxt = (r.forma && !String(r.evaluacion || '').includes('Forma')) ? ' · Forma ' + esc(r.forma) : '';
  const parcialTxt = r.parcial ? ' · Parcial ' + esc(r.parcial) : '';
  /* la fecha que importa es la de la prueba (la escribió el alumno); si no vino, la del análisis */
  const f = r.fecha_prueba ? '📅 Prueba: ' + fmtFecha(r.fecha_prueba) : fmtFecha(r.fecha);
  return '<div class="nota-card">' +
    '<div class="nc-top"><span class="nc-eval">' + esc(r.evaluacion || 'Evaluación') + '</span>' +
    '<span class="nc-val ' + (esNSP || !ok ? 'baja' : 'ok') + '">' + val + (ok ? ' ✔' : '') + '</span></div>' +
    '<div class="nc-meta">' + esc(r.categoria || '') + parcialTxt + formaTxt + (f ? ' · ' + f : '') +
    (r.docente ? ' · ' + esc(r.docente) : '') + '</div></div>';
}
function msjMaestroHTML(r) {
  if (!r || !r.mensaje) return '';
  return '<div class="msj-maestro">💬 <em>Mensaje del maestro:</em><br>' + linkify(esc(r.mensaje)) + '</div>';
}
function avisoCache() {
  return ROWS_CACHE && ROWS_FECHA
    ? '<br><small>📴 (datos guardados el ' + fmtFecha(ROWS_FECHA) + ' — toque «🔄 Actualizar» con internet)</small>'
    : '';
}
/* Fecha del último dato que subió el maestro (la nube ya la manda:
   actualizado_en en lo administrativo, fecha en el plan) */
function fechaCorte() {
  let max = '';
  (ROWS || []).concat(ROWS_AD || [], ROWS_AV || []).forEach(r => {
    const f = String(r.actualizado_en || r.fecha || '');
    if (f && f > max) max = f;
  });
  return max;
}
/* Sello de frescura: cada respuesta dice de cuándo son los datos, y si el
   maestro lleva mucho sin publicar, se avisa en vez de afirmar con datos viejos */
function selloDatos() {
  const f = fechaCorte();
  if (!f) return avisoCache();
  const d = new Date(f);
  const dias = isNaN(d) ? 0 : Math.floor((Date.now() - d.getTime()) / 86400000);
  const sello = dias > 21
    ? '<br><small>⚠️ El maestro no publica desde el ' + fmtFecha(f) + ' — si algo no cuadra, confirme en la escuela.</small>'
    : '<br><small>🕐 Datos del maestro al ' + fmtFecha(f) + '</small>';
  return sello.concat(avisoCache());
}

/* ── consulta a la nube (plan de acción + registros administrativos) ── */
function _desdeCache(codigo) {
  const c = cacheLoad(codigo);
  if (c && ((Array.isArray(c.rows) && c.rows.length) || (Array.isArray(c.admin) && c.admin.length) ||
            (Array.isArray(c.avisos) && c.avisos.length))) {
    ROWS = Array.isArray(c.rows) ? c.rows : [];
    ROWS_AD = Array.isArray(c.admin) ? c.admin : [];
    ROWS_AV = Array.isArray(c.avisos) ? c.avisos : [];
    ROWS_FECHA = c.t; ROWS_CACHE = true;
    return true;
  }
  return false;
}
async function consultar(codigo) {
  ROWS = null; ROWS_AD = null; ROWS_AV = null; ROWS_CACHE = false; ROWS_FECHA = null;
  if (navigator.onLine === false) return _desdeCache(codigo) ? 'cache' : 'offline';
  try {
    let url = SB_URL_DEF, key = SB_KEY_DEF;
    try {
      url = localStorage.getItem('METAS_SB_URL') || url;
      key = localStorage.getItem('METAS_SB_KEY') || key;
    } catch (_) {}
    /* Si el servidor falla (r.ok false) NO se disfraza de «sin datos»:
       así el bot no le echa la culpa a la clave del padre. */
    const pide = fn => fetch(url + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'apikey': key, 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_codigo: codigo }),
    }).then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
    const seguro = p => p.then(v => ({ ok: true, v })).catch(() => ({ ok: false, v: [] }));
    const [plan, admin, avisos] = await Promise.all([
      seguro(pide('metas_consultar_plan_padre')),
      seguro(pide('metas_consultar_admin_padre')),
      seguro(pide('metas_consultar_avisos_padre')),   /* si aún no existe en la nube, se tolera */
    ]);
    const rows = Array.isArray(plan.v) ? plan.v : [];
    const adm  = Array.isArray(admin.v) ? admin.v : [];
    const avs  = Array.isArray(avisos.v) ? avisos.v : [];
    if (!rows.length && !adm.length && !avs.length) {
      if (!plan.ok || !admin.ok) return _desdeCache(codigo) ? 'cache' : 'error';
      return 'vacio';
    }
    ROWS = rows; ROWS_AD = adm; ROWS_AV = avs; ROWS_FECHA = new Date().toISOString();
    cacheSave(codigo, rows, adm, avs);
    return 'ok';
  } catch (_) {
    return _desdeCache(codigo) ? 'cache' : 'error';
  }
}

/* Asegura que hay datos antes de responder; devuelve true si los hay */
async function conDatos() {
  const codigo = claveGuardada();
  if (!codigo) {
    await botSay('Primero necesito la <strong>clave de la familia</strong> 🔑 (la tira que le entregó el maestro, ej. <strong>15-K7QM</strong>). Escríbala aquí abajo.',
      ['❓ ¿Qué es la clave?']);
    return false;
  }
  if (ROWS !== null && (ROWS.length || (ROWS_AD && ROWS_AD.length) || (ROWS_AV && ROWS_AV.length))) return true;
  await botSay('⏳ Un momento, consulto las notas de la clave <strong>' + esc(claveBonita(codigo)) + '</strong>…');
  const st = await consultar(codigo);
  if (st === 'ok' || st === 'cache') return true;
  if (st === 'vacio') {
    await botSay('Aún no hay notas guardadas para la clave <strong>' + esc(claveBonita(codigo)) + '</strong>. ' +
      'Puede ser que el maestro todavía no las suba, o que la clave tenga un error. ' +
      'Verifíquela con la tira impresa o pregunte al maestro. 🙏',
      ['🔄 Actualizar', '🔑 Cambiar clave', '❓ ¿Qué es la clave?']);
    return false;
  }
  if (st === 'offline') {
    await botSay('📴 Ahorita no hay internet y todavía no tengo notas guardadas en este teléfono. ' +
      'Intente de nuevo cuando tenga conexión.', ['🔄 Actualizar']);
    return false;
  }
  await botSay('⚠️ No pude consultar la nube en este momento. Intente de nuevo en unos minutos.', ['🔄 Actualizar']);
  return false;
}

/* ── respuestas ── */
/* Cuando el maestro aún no sube notas del plan pero sí hay datos
   administrativos, se orienta al padre a lo que sí puedo contarle */
async function _sinPlan() {
  await botSay('El maestro aún no sube evaluaciones del Plan de Acción para esta clave, ' +
    'pero sí puedo contarle otras cosas: 👇', ['📣 Avisos', '🗓 ¿Faltó a clases?', '🧮 Boleta del parcial', '💰 Pagos y colectas', '🙂 Conducta', '💡 Consejo de hoy']);
}

async function respResumen() {
  if (!await conDatos()) return;
  if (!ROWS.length) { await _sinPlan(); return; }
  const conNota = ROWS.filter(r => pctDe(r) !== null);
  const nsp = ROWS.filter(r => r.nsp).length;
  const aprob = conNota.filter(r => pctDe(r) >= 70).length;
  let html = '';
  if (!conNota.length) {
    html = 'Por ahora hay <strong>' + ROWS.length + '</strong> registro(s), pero sin nota numérica' +
      (nsp ? ' (' + nsp + ' con <strong>NSP</strong>: no se presentó)' : '') + '.';
  } else {
    const prom = Math.round(conNota.reduce((s, r) => s + pctDe(r), 0) / conNota.length);
    let veredicto;
    if (prom >= 90)      veredicto = '¡Va <strong>excelente</strong>! 🌟 Felicítenlo/a en casa.';
    else if (prom >= 80) veredicto = 'Va <strong>muy bien</strong> 💪 ¡Sigan así!';
    else if (prom >= 70) veredicto = 'Va <strong>bien</strong> ✔ — con apoyo en casa puede subir aún más.';
    else if (prom >= 60) veredicto = 'Necesita <strong>refuerzo</strong> ⚠️ — el repaso diario en casa hace la diferencia.';
    else                 veredicto = 'Necesita <strong>mucho apoyo</strong> ❗ Les recomiendo hablar con el maestro esta semana.';
    html = '📊 Tengo <strong>' + ROWS.length + '</strong> evaluación(es) registrada(s). ' +
      'Promedio: <strong>' + prom + '/100</strong>. Aprobadas: <strong>' + aprob + ' de ' + conNota.length + '</strong>' +
      (nsp ? ' · NSP: ' + nsp : '') + '.<br>' + veredicto;
  }
  const nAvisos = avDe(['aviso', 'evento', 'material', 'individual']).length;
  if (nAvisos) html += '<br>📣 Tiene <strong>' + nAvisos + '</strong> aviso(s) del maestro — toque «📣 Avisos».';
  html += notaCardHTML(ROWS[0]) + selloDatos();
  await botSay(html, chipsMenu());
}

/* Palabras clave por materia: se emparejan al INICIO de palabra
   («mate» exacta cuenta, «materia» no) */
const MATERIAS = {
  'matemáticas': ['matematic', 'numero', 'multiplic', 'divis', 'fraccion', 'geometr', 'suma', 'resta', 'decimal', 'algebra'],
  'español':     ['espanol', 'lengua', 'lectura', 'ortografia', 'gramatica', 'verbo', 'sustantivo', 'comprension'],
  'ciencias naturales': ['naturales', 'ciencia', 'ecosistema', 'planta', 'animal'],
  'ciencias sociales':  ['sociales', 'historia', 'geografia', 'civica'],
  'inglés':      ['ingles', 'english'],
};
function materiaEn(txt) {
  const t = norm(txt);
  if (/\bmate\b/.test(t)) return 'matemáticas';
  for (const m in MATERIAS) {
    if (MATERIAS[m].some(k => new RegExp('\\b' + k).test(t))) return m;
  }
  return '';
}
async function respMateria(txt) {
  if (!await conDatos()) return;
  const nombre = materiaEn(txt);
  const claves = nombre ? MATERIAS[nombre] : null;
  if (!claves) return false;
  const filas = ROWS.filter(r => {
    const e = norm(r.evaluacion || '');
    return claves.some(k => e.includes(k)) || e.includes(norm(nombre));
  });
  if (!filas.length) {
    await botSay('No encuentro evaluaciones de <strong>' + esc(nombre) + '</strong> entre las notas registradas. ' +
      'Puede ver todas con «📚 Todas las notas».', chipsMenu());
  } else {
    await botSay('Esto tengo de <strong>' + esc(nombre) + '</strong>:' +
      filas.slice(0, 6).map(notaCardHTML).join('') + selloDatos(), chipsMenu());
  }
  return true;
}

const PA_PERSONALIDAD = ['Puntualidad', 'Espíritu de trabajo', 'Orden y presentación', 'Sociabilidad', 'Moralidad'];
function esPersonalidad(m) { return PA_PERSONALIDAD.some(x => norm(x) === norm(m || '')); }
function esInasistencias(m) { return norm(m || '') === norm('Inasistencias'); }

async function respFinales(txt) {
  if (!await conDatos()) return;
  // Incluye académico (número), conducta (letra en `estado`) e inasistencias.
  const rs = adFilas('nota_final').filter(r => (typeof r.nota === 'number') || (r.estado && String(r.estado).trim()));
  if (!rs.length) {
    await botSay('🧮 El maestro todavía no sube <strong>notas finales de parcial</strong> para esta clave. ' +
      'Las notas de evaluaciones sueltas están en «📚 Todas las notas».', chipsMenu());
    return;
  }
  /* ¿preguntó por un parcial específico? */
  const t = norm(txt || '');
  const mapa = { '1': 'I', '2': 'II', '3': 'III', '4': 'IV', 'i': 'I', 'ii': 'II', 'iii': 'III', 'iv': 'IV' };
  let pedido = '';
  const m = t.match(/parcial\s*(iv|iii|ii|i|[1-4])/);
  if (m) pedido = mapa[m[1]] || '';
  const porParcial = {};
  rs.forEach(r => {
    const p = r.parcial || '?';
    (porParcial[p] = porParcial[p] || []).push(r);
  });
  const parciales = ['I', 'II', 'III', 'IV'].filter(p => porParcial[p] && (!pedido || p === pedido));
  if (!parciales.length) {
    await botSay('🧮 Aún no hay notas finales del <strong>Parcial ' + esc(pedido) + '</strong>. ' +
      'Parciales con notas: ' + Object.keys(porParcial).join(', ') + '.', chipsMenu());
    return;
  }
  const byMat = (a, b) => String(a.materia).localeCompare(String(b.materia));
  const linea = (nom, val, color) => '<div class="nc-meta" style="font-size:14px;margin-top:4px">' +
    esc(nom) + ': <strong style="color:' + color + '">' + esc(String(val)) + '</strong></div>';
  const html = parciales.map(p => {
    const filas = porParcial[p];
    const acad = filas.filter(r => typeof r.nota === 'number' && !esPersonalidad(r.materia) && !esInasistencias(r.materia)).sort(byMat);
    const cond = filas.filter(r => esPersonalidad(r.materia)).sort(byMat);
    const ina = filas.filter(r => esInasistencias(r.materia));
    let cuerpo = '';
    acad.forEach(r => { const ok = r.nota >= 70; cuerpo += linea(r.materia || 'Materia', r.nota + (ok ? ' ✔' : ' ⚠️'), ok ? '#1e8e3e' : '#c0392b'); });
    if (cond.length) {
      cuerpo += '<div class="nc-meta" style="font-size:12.5px;margin-top:6px;font-weight:800">🙂 Conducta <small style="font-weight:400">(S = Sobresaliente · MB = Muy Bueno · B = Bueno)</small></div>';
      cond.forEach(r => cuerpo += linea(r.materia, r.estado || r.nota || '—', '#1e3a7c'));
    }
    if (ina.length) {
      const tot = ina.reduce((s, r) => s + (typeof r.nota === 'number' ? r.nota : 0), 0);
      cuerpo += linea('📅 Inasistencias', tot + ' día(s)', '#8a6d00');
    }
    return '<div class="nota-card"><div class="nc-top"><span class="nc-eval">🧮 Parcial ' + esc(p) + '</span></div>' + cuerpo + '</div>';
  }).join('');
  await botSay('Estas son las <strong>notas finales</strong> registradas (se aprueba con 70):' + html + selloDatos(), chipsMenu());
}

   del padre (≥2 palabras en común de 4+ letras, o 1 palabra larga) */
const FAQ_STOP = ['como', 'cuando', 'donde', 'cual', 'cuales', 'para', 'porque',
                  'hijo', 'hija', 'nino', 'nina', 'debe', 'hace', 'esta', 'este', 'tiene'];
function faqMatch(t) {
  const faqs = avDe(['faq']);
  if (!faqs.length) return null;
  const palabras = String(t || '').split(' ').filter(w => w.length >= 4 && FAQ_STOP.indexOf(w) < 0);
  let mejor = null, mejorScore = 0;
  faqs.forEach(f => {
    const bolsa = norm((f.pregunta || '') + ' ' + (f.claves || ''));
    let score = 0, larga = false;
    palabras.forEach(w => { if (bolsa.indexOf(w) >= 0) { score++; if (w.length >= 6) larga = true; } });
    if ((score >= 2 || (score >= 1 && larga)) && score > mejorScore) { mejor = f; mejorScore = score; }
  });
  return mejor;
}
/* Responde con la ficha del aula si puede; devuelve true si ya contestó */
async function respFicha(t) {
  if (!claveGuardada()) return false;
  if (ROWS_AV === null && !await conDatos()) return true;   /* conDatos ya explicó el problema */
  const f = faqMatch(t);
  if (!f) return false;
  await botSay('📖 <strong>' + esc(f.pregunta) + '</strong><br>' + linkify(esc(f.texto || '')) + selloDatos(), chipsMenu());
  return true;
}

async function respQueEsClave() {
  await botSay('🔑 La <strong>clave de la familia</strong> es un código secreto (ej. <strong>15-K7QM</strong>) que el maestro ' +
    'entrega impreso en una tira de papel, una por estudiante. Con ella usted ve las notas de su hijo/a desde ' +
    'cualquier teléfono con internet — sin nombres y sin cuentas.<br>' +
    'Si no la tiene, pídala al maestro <strong>en privado</strong>. Cuando la tenga, escríbala aquí abajo. 👇',
    claveGuardada() ? chipsMenu() : []);
}

async function respCambiarClave() {
  const c = cfgLoad();
  if (Array.isArray(c.codigos)) c.codigos = c.codigos.filter(x => x.codigo !== c.codigo);
  delete c.codigo;
  if (Array.isArray(c.codigos) && c.codigos.length) c.codigo = c.codigos[0].codigo;
  cfgSave(c);
  ROWS = null; ROWS_CACHE = false;
  await botSay('Listo, borré esa clave. Escriba la nueva clave de la familia (ej. <strong>15-K7QM</strong>). 🔑' +
    (c.codigo ? '<br><small>(Sigue guardada la de ' + esc(aliasDe(c.codigo) || claveBonita(c.codigo)) + ')</small>' : ''),
    ['❓ ¿Qué es la clave?']);
}

/* Con dos o más claves guardadas (hermanos, o el mismo niño con dos
   maestros), el padre cambia de hijo/a con un toque */
async function respCambiarHijo() {
  const lista = cfgCodigos();
  if (lista.length < 2) {
    await botSay('Solo tengo guardada una clave. Si tiene <strong>otro hijo/a</strong> con su propia tira, ' +
      'escriba aquí su clave (ej. <strong>8-MN3P</strong>) y quedan las dos guardadas. 👧👦', chipsMenu());
    return;
  }
  const activo = claveGuardada();
  await botSay('¿De quién quiere saber? Toque su clave: 👇<br>' +
    lista.map(x => '• <strong>' + esc(claveBonita(x.codigo)) + '</strong>' +
      (x.alias ? ' — ' + esc(x.alias) : '') + (x.codigo === activo ? ' (viendo ahora)' : '')).join('<br>'),
    lista.map(x => '👧 ' + claveBonita(x.codigo)));
}

/* Identidad de la clave: con qué alumno/grupo/maestro cuadran los datos,
   para que la familia confirme que la tira es la de SU hijo/a */
function identidadClave(codigo) {
  const num = (String(codigo).match(/^(\d+)/) || [])[1] || '';
  let grupo = '', doc = '';
  (ROWS || []).concat(ROWS_AD || []).forEach(r => {
    if (!grupo) grupo = r.grupo || [(r.grado || ''), (r.seccion || '')].filter(Boolean).join(' ');
    if (!doc) doc = r.docente || '';
  });
  return { num, grupo: String(grupo).trim(), doc: String(doc).trim() };
}

async function usarClave(codigo) {
  const c = cfgLoad();
  c.codigo = codigo;
  if (!Array.isArray(c.codigos)) c.codigos = [];
  if (!c.codigos.some(x => x.codigo === codigo)) c.codigos.push({ codigo, alias: '' });
  cfgSave(c);
  ROWS = null;
  await botSay('🔑 Clave <strong>' + esc(claveBonita(codigo)) + '</strong> guardada. Consultando la nube…');
  const st = await consultar(codigo);
  if (st === 'ok' || st === 'cache') {
    /* confirmación de identidad: que la familia verifique la tira */
    const idn = identidadClave(codigo);
    if (idn.num) {
      const alias = '#' + idn.num + (idn.grupo ? ' de ' + idn.grupo : '');
      const c2 = cfgLoad();
      const e = (c2.codigos || []).find(x => x.codigo === codigo);
      if (e && !e.alias) { e.alias = alias; cfgSave(c2); }
      await botSay('✅ Los datos de esta clave son del <strong>alumno/a ' + esc(alias) + '</strong>' +
        (idn.doc ? ', con el/la docente <strong>' + esc(idn.doc) + '</strong>' : '') +
        '. Si no es su hijo/a, revise la tira y toque «🔑 Cambiar clave».');
    }
    await respResumen(); await sugerirInstalar(); return;
  }
  if (st === 'vacio') {
    const sospecha = /[01ILO]/.test(String(codigo).replace(/^\d+/, ''));
    await botSay('La clave quedó guardada, pero <strong>aún no hay notas</strong> para ella. ' +
      'Puede ser que el maestro no las haya subido todavía, o que un carácter esté equivocado — compare con la tira impresa. ' +
      (sospecha ? '<br>🔍 <strong>Ojo:</strong> las claves nunca usan <strong>0, 1, I, L</strong> ni <strong>O</strong> — revise justo esos caracteres. ' : '') +
      'Toque «🔄 Actualizar» más tarde.', ['🔄 Actualizar', '🔑 Cambiar clave']);
  } else if (st === 'offline') {
    await botSay('📴 No hay internet en este momento. La clave quedó guardada; toque «🔄 Actualizar» cuando tenga conexión.',
      ['🔄 Actualizar']);
  } else {
    await botSay('⚠️ No pude consultar la nube. Intente «🔄 Actualizar» en unos minutos.', ['🔄 Actualizar']);
  }
}

/* ── cerebro: decide qué responder ── */
/* Menú numerado del fallback: el padre puede contestar solo con el número */
const MENU_NUM = [respResumen, respUltima, respTodas, respAsistencia,
                  respFinales, respEconomia, respConducta, respAyudarCasa, respAvisos];
const MENU_TXT = 'Escriba el <strong>número</strong> de lo que necesita:<br>' +
  '1️⃣ Cómo va (resumen) · 2️⃣ Última nota<br>' +
  '3️⃣ Todas las notas · 4️⃣ Faltas<br>' +
  '5️⃣ Boleta del parcial · 6️⃣ Pagos y colectas<br>' +
  '7️⃣ Conducta · 8️⃣ Cómo ayudar en casa<br>' +
  '9️⃣ Avisos del maestro';
/* Pistas parciales: si la frase no entendida trae un fragmento reconocible
   («pagand», «faltas de mi niña»…), se sugiere el chip probable antes del menú */
const PISTAS = [
  [/pag|deb|cuot|colect|aport|diner|pisto|lempir|cobr/, '💰 Pagos y colectas'],
  [/avis|reunion|junta|comunicad|acto|event/, '📣 Avisos'],
  [/falt|asist|ausen|llego/, '🗓 ¿Faltó a clases?'],
  [/conduct|porta|disciplin/, '🙂 Conducta'],
  [/boleta|parcial|final|sace/, '🧮 Boleta del parcial'],
  [/not|calif|evalu|examen|prueb|saco/, '📚 Todas las notas'],
];
/* Preguntas que no se entendieron: se guardan en el teléfono para que el
   proyecto sepa QUÉ preguntan los padres de verdad (materia prima de FAQs) */
function guardarNoEntendida(txt) {
  try {
    const K = 'METAS_PADRE_NOENT_V1';
    const arr = JSON.parse(localStorage.getItem(K) || '[]');
    arr.push({ q: String(txt).slice(0, 140), t: new Date().toISOString() });
    localStorage.setItem(K, JSON.stringify(arr.slice(-100)));
  } catch (_) {}
}

async function manejar(txtOriginal) {
  const clave = pareceClave(txtOriginal);
  if (clave) { await usarClave(clave); return; }
  /* casi-clave: trae 0, 1, I, L u O — caracteres que nunca usamos */
  const casi = casiClave(txtOriginal);
  if (casi) {
    await botSay('🔍 Eso <strong>casi</strong> es una clave, pero las claves nunca usan ' +
      '<strong>0, 1, I, L</strong> ni <strong>O</strong> (se confunden entre sí). ' +
      'Mire la tira con calma: ¿será una <strong>Q</strong> en vez de O, o un <strong>7</strong> en vez de 1? ' +
      'Escríbala de nuevo tal como aparece impresa. 🙏', ['❓ ¿Qué es la clave?']);
    return;
  }

  /* norm + expand: «q debe mi ijo» → «que debe mi hijo» */
  const t = expand(norm(txtOriginal));
  if (!t) return;

  /* respuesta con número del menú (1-9) */
  if (/^[1-9]$/.test(t)) { await MENU_NUM[+t - 1](t); return; }

  if (/instalar|pantalla de inicio|dejar como app/.test(t)) {
    if (_pwaPrompt) {
      const p = _pwaPrompt; _pwaPrompt = null;
      p.prompt();
      await botSay('📲 Siga las instrucciones de su teléfono y el asistente quedará en su pantalla de inicio.', chipsMenu());
    } else {
      await botSay('📲 En el menú del navegador (⋮) toque «<strong>Agregar a pantalla de inicio</strong>». ' +
        'Si ya lo instaló, ¡no necesita nada más! 🤗', chipsMenu());
    }
    return;
  }
  if (/cambiar de (hijo|hija|nino|nina)|otro hijo|otra hija|mis hijos|el otro nino|la otra nina/.test(t)) { await respCambiarHijo(); return; }
  if (/(cambiar|otra|nueva|borrar).*(clave|codigo)|cambiar clave/.test(t)) { await respCambiarClave(); return; }
  if (/(que es|donde|cual|como consigo|no tengo).*(clave|codigo)/.test(t) || t === 'clave' || t === 'codigo') { await respQueEsClave(); return; }
  if (/actualizar|refrescar|consultar|de nuevo|recargar/.test(t)) {
    ROWS = null;
    if (await conDatos()) await respResumen();
    return;
  }
  /* conducta ANTES que notas (el dato viaja dentro de las notas finales) */
  if (/conducta|comporta|se porta|disciplin|puntualidad|moralidad|sociabilidad|orden y presentacion/.test(t)) { await respConducta(t); return; }
  /* dinero ANTES que faltas: «cuánto falta pagar» es economía, no asistencia */
  if (!/tarea/.test(t) &&
      /colaboracion|aporte|cuota|colecta|deuda|dinero|pisto|lempira|cobr|\bpag(o|ar|ue|os|amos)\b|\bdeb(o|e|en|emos)\b(?! mejorar)|cuanto (hay que pagar|se paga|es|cuesta)|pendiente/.test(t)) {
    await respEconomia(); return;
  }
  /* comunicados del maestro: avisos y eventos, materiales, ficha del aula */
  if (/aviso|comunicad|anuncio|reunion|junta|convocatoria|evento|acto civico|suspend/.test(t)) { await respAvisos(); return; }
  if (/material|utiles|mochila|\bque lleva\b|que hay que (llevar|traer)|\btraer\b|\bllevar\b/.test(t)) { await respMateriales(); return; }
  if (/horario|hora de (salida|entrada)|a que hora (entra|sale)|uniforme|matricul|traslado|reposicion|\brepone/.test(t)) {
    if (await respFicha(t)) return;
    guardarNoEntendida(txtOriginal);
    await botSay('Esa pregunta se responde con la <strong>ficha del aula</strong> que llena el maestro, ' +
      'y la de su grupo todavía no tiene esa respuesta. Puedo ayudarle con esto: 👇', chipsMenu());
    return;
  }
  if (/falto|falta|asisten|ausen|inasist|llego a clase/.test(t)) { await respAsistencia(); return; }
  if (/nota.? final|finales|sace|boleta|\bparcial\b/.test(t)) { await respFinales(t); return; }
  if (materiaEn(t)) { await respMateria(t); return; }
  if (/ultima|ultimo|reciente|\bque saco\b|cuanto saco|nota nueva/.test(t)) { await respUltima(); return; }
  if (/como va|como esta|como le va|resumen|avance|progreso|rendimiento|promedio/.test(t)) { await respResumen(); return; }
  if (/todas|historial|lista de notas|calificaciones|ver notas|las notas|notas/.test(t)) { await respTodas(); return; }
  if (/aprobo|aprobado|aproband|aplaz|paso o no|reprobo|perdio|gano la|pas(a|o|ar) (de grado|el ano|el grado)/.test(t)) { await respAprobo(); return; }
  if (/consejo|tip|recomendacion/.test(t)) { await respConsejo(); return; }
  if (/ayud|apoyar|en casa|reforzar|practicar|repasar|mejorar|que hacer|que hago/.test(t)) { await respAyudarCasa(); return; }
  if (/maestro|maestra|profesor|profesora|profe|docente|quien califica/.test(t)) { await respMaestro(); return; }
  if (/\bnsp\b|no se presento/.test(t)) {
    const fNsp = avDe(['faq']).find(f => /nsp|repone/.test(norm((f.pregunta || '') + ' ' + (f.claves || ''))));
    await botSay('<strong>NSP</strong> significa «No Se Presentó»: el estudiante no hizo esa evaluación. ' +
      (fNsp ? '<br>📖 <strong>Para reponerla:</strong> ' + esc(fNsp.texto)
            : 'Hable con el maestro para ver cómo reponerla. 🙏'), chipsMenu());
    return;
  }
  if (/que es metas|que es m e t a s|que es esta pagina|que es la app/.test(t)) {
    await botSay('📚 <strong>M.E.T.A.S</strong> son misiones educativas gratuitas alineadas al currículo de Honduras: ' +
      'su hijo/a estudia, practica y se evalúa desde cualquier teléfono, incluso sin internet. ' +
      'Este asistente le muestra a usted las notas que registra el maestro. ' +
      '<a href="index.html">Abrir la app</a> 🚀', chipsMenu());
    return;
  }
  if (/hola|buenas|buenos dias|buenas tardes|buenas noches|saludos/.test(t)) {
    await botSay('¡Hola! 👋 Estoy para servirle. Puede tocar un botón o escribir su pregunta.', chipsMenu());
    return;
  }
  if (/gracias|muy amable|excelente|perfecto|ok|vale|adios|hasta luego/.test(t)) {
    await botSay('¡Con mucho gusto! 🤗 Su acompañamiento en casa es la mitad del éxito. Aquí estaré cuando me necesite.', chipsMenu());
    return;
  }
  /* ¿la ficha del aula responde esto? (solo con datos ya cargados:
     no se consulta la nube nada más para decir «No entendí») */
  if (ROWS_AV && ROWS_AV.length) {
    const f = faqMatch(t);
    if (f) {
      await botSay('📖 <strong>' + esc(f.pregunta) + '</strong><br>' + linkify(esc(f.texto || '')) + selloDatos(), chipsMenu());
      return;
    }
  }
  /* no entendido: se guarda la pregunta y se ofrece el menú numerado */
  guardarNoEntendida(txtOriginal);
  if (!claveGuardada()) {
    await botSay('No entendí 😅. Si ya tiene la <strong>clave de la familia</strong> (ej. 15-K7QM), escríbala tal cual. ' +
      'Si no la tiene, toque el botón de abajo.', ['❓ ¿Qué es la clave?']);
  } else {
    const pista = PISTAS.find(p => p[0].test(t));
    if (pista) {
      await botSay('No entendí bien 😅, pero creo que pregunta por <strong>' +
        esc(pista[1].replace(/^\S+\s/, '')) + '</strong> — toque el primer botón si es así. ' +
        'También puede escribir el número:<br>' + MENU_TXT,
        [pista[1]].concat(chipsMenu().filter(c => c !== pista[1])));
    } else {
      await botSay('No entendí esa pregunta 😅. ' + MENU_TXT, chipsMenu());
    }
  }
}

/* ── novedades desde la última visita (diff contra el caché anterior) ── */
function _sigSet(arr, fn) { const s = new Set(); (arr || []).forEach(r => s.add(fn(r))); return s; }
async function novedadesDesde(prev) {
  if (!prev) return;
  const sigN = r => [r.evaluacion, r.materia, r.fecha, r.nota, r.nsp ? 1 : ''].join('|');
  const sigA = r => [r.tipo, r.fecha, r.parcial, r.materia, r.nota, r.estado, r.concepto, r.monto].join('|');
  const sigV = r => [r.subtipo, r.titulo, r.texto, r.pregunta].join('|');
  const vN = _sigSet(prev.rows, sigN), vA = _sigSet(prev.admin, sigA), vV = _sigSet(prev.avisos, sigV);
  const notas = (ROWS || []).filter(r => !vN.has(sigN(r)));
  const faltas = (ROWS_AD || []).filter(r => r.tipo === 'asistencia' &&
    (r.estado === 'ausente' || r.estado === 'excusa') && !vA.has(sigA(r)));
  const otrosAd = (ROWS_AD || []).filter(r => r.tipo !== 'asistencia' && !vA.has(sigA(r)));
  const avisos = avDe(['aviso', 'evento', 'material', 'individual']).filter(r => !vV.has(sigV(r)));
  const partes = [];
  if (notas.length) {
    const mats = notas.map(r => r.materia).filter(Boolean)
      .filter((m, i, a) => a.indexOf(m) === i).slice(0, 2);
    partes.push(notas.length + (notas.length > 1 ? ' notas nuevas' : ' nota nueva') +
      (mats.length ? ' (' + mats.join(', ') + ')' : ''));
  }
  if (avisos.length) partes.push(avisos.length + ' aviso(s) del maestro');
  if (faltas.length) partes.push(faltas.length + ' falta(s) registrada(s)');
  if (otrosAd.length) partes.push('cambios en boleta o pagos');
  if (!partes.length) return;
  await botSay('👀 <strong>Desde su última visita' + (prev.t ? ' (' + fmtFecha(prev.t) + ')' : '') +
    ':</strong> ' + esc(partes.join(' · ')) + '.');
}

/* ── PWA: instalable y abre sin señal (mismo sw.js del index) ── */
let _pwaPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _pwaPrompt = e; });
if ('serviceWorker' in navigator) {
  try { navigator.serviceWorker.register('sw.js'); } catch (_) {}
}
/* Tras la primera consulta con éxito se sugiere UNA vez dejar el
   asistente como app en la pantalla de inicio */
async function sugerirInstalar() {
  try {
    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return;
  } catch (_) {}
  const c = cfgLoad();
  if (c.pwaHint) return;
  c.pwaHint = 1; cfgSave(c);
  if (_pwaPrompt) {
    await botSay('📲 ¿Quiere dejar este asistente como una <strong>app</strong> en su teléfono, ' +
      'para abrirlo con un toque? Toque el botón:', ['📲 Instalar el asistente'].concat(chipsMenu()));
  } else {
    await botSay('📲 <strong>Consejo:</strong> en el menú del navegador (⋮) toque ' +
      '«<strong>Agregar a pantalla de inicio</strong>» y este asistente le quedará como una app.', chipsMenu());
  }
}

/* ── envío ── */
function enviar() {
  const v = $inp.value.trim();
  if (!v) return;
  $inp.value = '';
  userSay(v);
  manejar(v);
}
document.getElementById('enviar').addEventListener('click', enviar);
$inp.addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });

/* ── arranque ── */
(async function inicio() {
  const codigo = claveGuardada();
  await botSay('¡Hola! 👋 Soy el <strong>asistente de M.E.T.A.S</strong> para madres y padres. ' +
    'Le cuento cómo va su hijo/a en la escuela: notas, mensajes del maestro y consejos para apoyar en casa.');
  if (codigo) {
    const alias = aliasDe(codigo);
    await botSay('Tengo guardada la clave <strong>' + esc(claveBonita(codigo)) + '</strong>' +
      (alias ? ' (' + esc(alias) + ')' : '') + '. Consultando las notas…');
    const prev = cacheLoad(codigo);   /* para contar novedades al volver */
    const st = await consultar(codigo);
    if (st === 'ok' || st === 'cache') {
      if (st === 'ok') await novedadesDesde(prev);
      await respResumen(); await sugerirInstalar();
    }
    else if (st === 'vacio') {
      await botSay('Aún no hay notas para esa clave. Toque «🔄 Actualizar» más tarde, o cambie la clave si no es la correcta.',
        ['🔄 Actualizar', '🔑 Cambiar clave', '❓ ¿Qué es la clave?']);
    } else if (st === 'offline') {
      await botSay('📴 No hay internet ahorita y no tengo notas guardadas. Vuelva a intentarlo con conexión.',
        ['🔄 Actualizar', '💡 Consejo de hoy']);
    } else {
      await botSay('⚠️ No pude consultar la nube. Intente «🔄 Actualizar» en unos minutos.',
        ['🔄 Actualizar', '💡 Consejo de hoy']);
    }
  } else {
    await botSay('Para empezar, escriba la <strong>clave de la familia</strong> que le entregó el maestro en una tira de papel ' +
      '(empieza con el número de lista, ej. <strong>15-K7QM</strong>). Es secreta: solo su familia la conoce. 🔑',
      ['❓ ¿Qué es la clave?']);
  }
})();
