<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14833b">
  <title>Asistente para madres y padres — M.E.T.A.S</title>
  <meta name="description" content="Consulte con la clave de su familia cómo va su hijo o hija: notas, mensajes del maestro y consejos para apoyar en casa.">
  <meta property="og:title" content="🤖 Asistente M.E.T.A.S para madres y padres">
  <meta property="og:description" content="Escriba la clave de su familia y pregunte: ¿cómo va mi hijo?, ¿qué sacó?, ¿cómo lo ayudo en casa?">
  <meta property="og:image" content="https://metas.policastsapien.com/img/icon-512.png">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="manifest" href="manifest-padres.json">
  <style>
    :root {
      --verde: #14833b;
      --verde-osc: #0d5f2a;
      --verde-claro: #e6f6ec;
      --tinta: #1c2733;
      --muted: #5b6b7b;
      --fondo: #eef3ee;
      --blanco: #ffffff;
      --burbuja-padre: #d7f0dd;
      --ok: #1e8e3e;
      --baja: #c0392b;
      --borde: #d5dfd8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--fondo);
      color: var(--tinta);
      display: flex; flex-direction: column;
      height: 100dvh;
    }
    /* ── Encabezado ── */
    header {
      background: var(--verde); color: #fff;
      padding: 9px 14px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      flex: 0 0 auto;
    }
    .h-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex: 0 0 auto;
    }
    .h-txt { min-width: 0; }
    .h-t1 { font-size: 16px; font-weight: 800; line-height: 1.2; }
    /* El candado del aviso de privacidad. Va antes de «Inicio» y se lleva el
       margin-left:auto, que es lo que los empuja a los dos a la derecha; si
       se lo dejara a «Inicio», el candado se quedaría pegado al título. Y
       44 px de blanco de toque: es lo que un dedo acierta sin mirar. */
    .h-privacidad {
      margin-left: auto; flex: 0 0 auto;
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 44px; min-height: 44px;
      color: #fff; text-decoration: none; font-size: 17px;
    }
    .h-inicio {
      flex: 0 0 auto;
      color: #fff; text-decoration: none; font-size: 12px; font-weight: 700;
      background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.45);
      padding: 7px 10px; border-radius: 999px;
    }
    /* ── Zona de chat ── */
    #chat {
      flex: 1 1 auto; overflow-y: auto;
      padding: 14px 12px 8px;
      -webkit-overflow-scrolling: touch;
      /* referencia de offsetTop para llevar la vista al INICIO de una
         respuesta larga (ver botSay) */
      position: relative;
    }
    .msg { display: flex; margin-bottom: 10px; }
    .msg.bot { justify-content: flex-start; }
    .msg.yo  { justify-content: flex-end; }
    .bub {
      max-width: 86%;
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 16px; line-height: 1.5;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
      word-wrap: break-word; overflow-wrap: break-word;
    }
    .bot .bub { background: var(--blanco); border-bottom-left-radius: 5px; }
    .yo  .bub { background: var(--burbuja-padre); border-bottom-right-radius: 5px; }
    .bub a { color: var(--verde-osc); font-weight: 700; word-break: break-all; }
    .bub strong { color: var(--verde-osc); }
    /* Tarjeta de nota dentro de una burbuja */
    .nota-card {
      background: var(--verde-claro); border: 1px solid var(--borde);
      border-radius: 10px; padding: 8px 10px; margin-top: 8px;
      font-size: 15px;
    }
    .nota-card .nc-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .nota-card .nc-eval { font-weight: 700; }
    .nota-card .nc-val { font-weight: 900; white-space: nowrap; }
    .nota-card .nc-val.ok  { color: var(--ok); }
    .nota-card .nc-val.baja{ color: var(--baja); }
    .nota-card .nc-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .msj-maestro {
      background: #fff8e6; border-left: 4px solid #e6a817;
      border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 15px;
    }
    /* Recibo de aporte: el número va como dato de documento (chiquito, al pie),
       no como una clave que el padre tenga que cuidar. */
    .rec-folio { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
    .rec-guardar {
      display: block; width: 100%; margin-top: 8px;
      background: var(--verde); color: #fff; border: none; border-radius: 9px;
      padding: 11px 12px; font-family: inherit; font-size: 15px; font-weight: 800;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .rec-guardar:active { transform: scale(.97); }
    .rec-guardar:disabled { opacity: .65; }
    .rec-img {
      display: block; width: 100%; height: auto; margin-top: 8px;
      border: 1px solid var(--borde); border-radius: 10px;
    }
    /* Bitácora: el botón lleva a la misión del tema de esa ficha */
    .bit-mision {
      display: block; margin-top: 8px; padding: 10px 12px;
      background: var(--verde); color: #fff !important; text-decoration: none;
      border-radius: 9px; font-size: 14.5px; font-weight: 800; text-align: center;
      word-break: normal;
    }
    .bit-mision:active { transform: scale(.98); }
    /* «Escribiendo…» */
    .typing .bub { color: var(--muted); font-style: italic; }
    /* ── Chips de respuesta rápida ── */
    /* Los chips se ENVUELVEN en filas: ningún botón queda escondido
       fuera de la pantalla (nada de deslizar a ciegas) */
    #chips {
      flex: 0 0 auto;
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 6px 12px 8px;
      /* En un teléfono los botones ocupaban media pantalla y la lectura
         quedaba en una rendija. Mientras se desliza hacia arriba (leyendo)
         se recogen; al deslizar hacia la caja de escribir, vuelven. */
      max-height: 60vh; overflow: hidden; opacity: 1;
      transition: max-height .28s ease, padding .28s ease, opacity .2s ease;
    }
    #chips.recogido { max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; }
    /* 🔊 escuchar el mensaje (accesibilidad) */
    .bub-oir {
      background: none; border: none; cursor: pointer;
      font-size: 15px; padding: 2px 4px; opacity: .55; vertical-align: middle;
    }
    .bub-oir:active { opacity: 1; }
    /* ✂️ modo de respuestas cortas: se ocultan pistas y sellos */
    body.corto .bub small { display: none; }
    .chip {
      flex: 0 0 auto; white-space: nowrap;
      background: var(--blanco); color: var(--verde-osc);
      border: 1.6px solid var(--verde);
      border-radius: 999px; padding: 7px 10px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: transform .12s;
    }
    .chip:active { transform: scale(.95); background: var(--verde-claro); }
    /* ── Entrada ── */
    #barra {
      flex: 0 0 auto;
      display: flex; gap: 8px;
      padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
      background: var(--blanco); border-top: 1px solid var(--borde);
    }
    #inp {
      flex: 1; border: 1.6px solid var(--borde); border-radius: 999px;
      padding: 12px 16px; font-size: 16px; outline: none; min-width: 0;
    }
    #inp:focus { border-color: var(--verde); }
    #enviar {
      flex: 0 0 auto; width: 50px; height: 50px; border-radius: 50%;
      background: var(--verde); color: #fff; border: none;
      font-size: 20px; cursor: pointer;
    }
    #enviar:active { background: var(--verde-osc); }
  </style>
</head>
<body>

  <!-- Una sola línea: en el teléfono cada renglón del encabezado se lo
       resta a la conversación, y el nombre largo no le decía nada nuevo
       a quien ya está adentro. -->
  <header>
    <div class="h-avatar">🤖</div>
    <div class="h-txt">
      <div class="h-t1">Asistente M.E.T.A.S</div>
    </div>
    <!-- El aviso de privacidad va AQUÍ y no en un pie: esta pantalla es un
         chat con la barra de escribir clavada abajo, así que un pie no se ve
         nunca. Y es la pantalla de la familia, que es justo a quien le
         importa qué se hace con los datos de su hijo. -->
    <a class="h-privacidad" href="privacidad.html" title="Aviso de privacidad">🔒</a>
    <a class="h-inicio" href="index.html">Inicio</a>
  </header>

  <div id="chat" aria-live="polite"></div>
  <div id="chips"></div>
  <div id="barra">
    <input id="inp" type="text" autocomplete="off" placeholder="Escriba su pregunta o la clave…">
    <button id="enviar" aria-label="Enviar">➤</button>
  </div>

<script>
/* ============================================================
   ASISTENTE DE PADRES — bot de reglas, sin costo y sin cuentas.
   Lee la nube con la RPC metas_consultar_plan_padre usando la
   clave de la familia (nº de lista + 4 letras, ej. 15-K7QM) que
   entrega el maestro en tiras impresas. Guarda la última consulta
   en el teléfono para poder releerla sin internet.
   ============================================================ */

const SB_URL_DEF = 'https://uljjgrikyigdrkbikcxo.supabase.co';
const SB_KEY_DEF = 'sb_publishable_VGj7He4XL8AGscsY3RsxGg__xlzi48w';
const PADRE_KEY  = 'METAS_PADRE_V1';        // misma clave que usa la vista Padre del index
const CACHE_KEY  = 'METAS_PADRE_CACHE_V1';  // última consulta exitosa (para releer offline)

const $chat  = document.getElementById('chat');
const $chips = document.getElementById('chips');
const $inp   = document.getElementById('inp');

let ROWS = null;          // filas del plan de acción (o null)
let ROWS_AD = null;       // filas administrativas: asistencia/notas finales/economía
let ROWS_AV = null;       // comunicados del maestro: avisos/eventos/materiales/cuentas/faq
let ROWS_FECHA = null;    // cuándo se consultaron
let ROWS_CACHE = false;   // true si vienen del respaldo local

/* ── utilidades ── */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function norm(s) {
  return String(s || '').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}
/* NORMATIVA DEL PROYECTO · cómo se escribe un grupo ─────────────────
   Un grupo SIEMPRE se lee «6º-1»: sexto grado, sección 1. Nunca «6 1»
   (dos números sueltos) ni «61» (parece sesenta y uno).
   Esta página es AUTÓNOMA —no carga js/tools/registros-admin.js— así que
   lleva su propia copia de adGradoSeccion(). Si allá cambia la regla,
   cambia también aquí: la madre y el maestro tienen que leer lo mismo. */
function grupoTxt(grado, seccion) {
  const g = String(grado || '').trim().replace(/^(\d{1,2})\s*[ºo°]?$/i, '$1º');
  const s = String(seccion || '').trim();
  if (!g || !s) return g || s;
  return (g.length <= 4 && s.length <= 3) ? g + '-' + s : g + ' ' + s;
}
/* Chat-speak y errores comunes al escribir («q debe mi ijo», «como ba»):
   se expanden palabra por palabra DESPUÉS de norm, para que las reglas
   trabajen siempre con español estándar. */
const EXPAND = {
  q: 'que', k: 'que', ke: 'que', xq: 'porque', xk: 'porque', pq: 'porque',
  porq: 'porque', porke: 'porque', devo: 'debo', deve: 'debe', deven: 'deben',
  ba: 'va', ban: 'van', ijo: 'hijo', ija: 'hija', ijos: 'hijos',
  mijo: 'mi hijo', mija: 'mi hija', ay: 'hay', tmb: 'tambien', tb: 'tambien',
  dnd: 'donde', qnd: 'cuando', cdo: 'cuando', cundo: 'cuando', kuanto: 'cuanto',
  qanto: 'cuanto', wenas: 'buenas', grasias: 'gracias', asta: 'hasta',
  aser: 'hacer', ase: 'hace', asen: 'hacen', orario: 'horario',
  sako: 'saco', kiero: 'quiero', nesesito: 'necesito',
  maistro: 'maestro', maextro: 'maestro', aprovo: 'aprobo', reprovo: 'reprobo',
};
function expand(t) {
  return String(t || '').split(' ').map(w => EXPAND[w] || w).join(' ');
}
function fmtFecha(iso) {
  /* fecha pura (2026-07-11): NO pasarla por Date — en Honduras (UTC-6)
     mostraría el día anterior */
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return m[3] + '/' + m[2] + '/' + m[1];
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return String(d.getDate()).padStart(2, '0') + '/' +
         String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
}
function pctDe(r) {
  if (r.nsp || typeof r.nota !== 'number') return null;
  const base = (typeof r.base === 'number' && r.base > 0) ? r.base : 100;
  return Math.round((r.nota / base) * 100);
}
/* Convierte URLs del mensaje del maestro en enlaces tocables */
function linkify(txtEscapado) {
  return txtEscapado.replace(/(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function cfgLoad() {
  try { const o = JSON.parse(localStorage.getItem(PADRE_KEY)); return (o && typeof o === 'object') ? o : {}; }
  catch (_) { return {}; }
}
function cfgSave(c) { try { localStorage.setItem(PADRE_KEY, JSON.stringify(c)); } catch (_) {} }
/* Caché POR CÓDIGO: cada hijo/a conserva su propio respaldo offline.
   Migra solo el formato viejo (una sola familia por teléfono). */
function _cacheTodo() {
  try {
    const o = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (!o || typeof o !== 'object') return {};
    if (o.codigo && o.rows !== undefined) {   /* formato viejo */
      const m = {}; m[o.codigo] = { t: o.t, rows: o.rows, admin: o.admin, avisos: o.avisos };
      return m;
    }
    return o;
  } catch (_) { return {}; }
}
function cacheLoad(codigo) { return _cacheTodo()[codigo] || null; }
function cacheSave(codigo, rows, admin, avisos) {
  try {
    const o = _cacheTodo();
    o[codigo] = { t: new Date().toISOString(), rows, admin, avisos };
    localStorage.setItem(CACHE_KEY, JSON.stringify(o));
  } catch (_) {}
}
/* Varios hijos en el mismo teléfono: cfg.codigos = [{codigo, alias}];
   cfg.codigo sigue siendo el ACTIVO (compatibilidad con la vista Padre) */
function cfgCodigos() {
  const c = cfgLoad();
  if (Array.isArray(c.codigos) && c.codigos.length) return c.codigos;
  if (c.codigo) { c.codigos = [{ codigo: c.codigo, alias: '' }]; cfgSave(c); return c.codigos; }
  return [];
}
function aliasDe(codigo) {
  const e = cfgCodigos().find(x => x.codigo === codigo);
  return (e && e.alias) ? e.alias : '';
}
function claveGuardada() { return String(cfgLoad().codigo || ''); }
function claveBonita(c)  { return String(c || '').replace(/^(\d+)/, '$1-'); }
/* ¿El texto parece una clave de familia? (nº de lista + 4-6 letras/números) */
function pareceClave(txt) {
  const limpio = String(txt || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  return /^\d{1,3}[A-Z2-9]{4,6}$/.test(limpio) ? limpio : '';
}
/* ¿CASI una clave? (trae 0, 1, I, L u O: caracteres que nunca usamos) */
function casiClave(txt) {
  const limpio = String(txt || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  const m = limpio.match(/^\d{1,3}([A-Z0-9]{4,6})$/);
  return (m && /[01ILO]/.test(m[1])) ? limpio : '';
}

/* ── burbujas ── */
function userSay(txt) {
  const div = document.createElement('div');
  div.className = 'msg yo';
  div.innerHTML = '<div class="bub">' + esc(txt) + '</div>';
  $chat.appendChild(div);
  $chat.scrollTop = $chat.scrollHeight;
}
let _typingEl = null;
function botTyping() {
  _typingEl = document.createElement('div');
  _typingEl.className = 'msg bot typing';
  _typingEl.innerHTML = '<div class="bub">escribiendo…</div>';
  $chat.appendChild(_typingEl);
  $chat.scrollTop = $chat.scrollHeight;
}
function botSay(html, chips) {
  return new Promise(res => {
    botTyping();
    setTimeout(() => {
      if (_typingEl) { _typingEl.remove(); _typingEl = null; }
      const div = document.createElement('div');
      div.className = 'msg bot';
      /* 🔊 leer en voz alta: gratis y local (speechSynthesis del navegador) */
      const oir = (typeof window !== 'undefined' && window.speechSynthesis)
        ? ' <button class="bub-oir" onclick="leerBurbuja(this)" title="Escuchar" aria-label="Escuchar este mensaje">🔊</button>' : '';
      div.innerHTML = '<div class="bub">' + html + oir + '</div>';
      $chat.appendChild(div);
      if (chips) pintarChips(chips);
      /* Una respuesta larga (Bitácora, todas las notas) se muestra desde su
         INICIO, que es donde va lo más reciente: antes se aterrizaba al final
         y a la familia le tocaba subir buscándolo. Si el mensaje cabe en
         pantalla, se va al fondo como siempre. Se ancla dos veces: si los
         botones estaban recogidos, su transición de apertura cambia la altura
         del chat DESPUÉS del primer cálculo y taparía el final del mensaje. */
      const ancla = () => {
        $chat.scrollTop = Math.min(div.offsetTop - 6, $chat.scrollHeight - $chat.clientHeight);
      };
      ancla(); setTimeout(ancla, 340);
      res();
    }, 420);
  });
}
function pintarChips(lista) {
  $chips.innerHTML = '';
  (lista || []).forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = c;
    b.addEventListener('click', () => { userSay(c); manejar(c); });
    $chips.appendChild(b);
  });
  /* con respuesta nueva, los botones vuelven a la vista */
  $chips.classList.remove('recogido');
}
/* ── botones que se apartan mientras se lee ──
   Se escucha el GESTO (dedo o rueda), no el scroll: cuando la vista ya
   está pegada al fondo el scroll no dispara eventos, y justo ahí es donde
   el padre desliza hacia arriba para releer. Dedo hacia abajo = está
   leyendo lo de antes → los botones se recogen. Dedo hacia arriba =
   viene a la caja de escribir → reaparecen. */
let _dedoY = null;
$chat.addEventListener('touchstart', e => { _dedoY = e.touches[0].clientY; }, { passive: true });
$chat.addEventListener('touchmove', e => {
  if (_dedoY == null) return;
  const dy = e.touches[0].clientY - _dedoY;
  if (dy > 14)       { $chips.classList.add('recogido');    _dedoY = e.touches[0].clientY; }
  else if (dy < -14) { $chips.classList.remove('recogido'); _dedoY = e.touches[0].clientY; }
}, { passive: true });
/* con ratón (computadora del maestro): la rueda hacia arriba también recoge */
$chat.addEventListener('wheel', e => {
  if (e.deltaY < 0) $chips.classList.add('recogido');
  else if (e.deltaY > 0) $chips.classList.remove('recogido');
}, { passive: true });
/* Nombres CORTOS: con quince botones, cada palabra de más era un renglón
   entero menos para la conversación. */
const CHIPS_BASE = ['📊 ¿Cómo va?', '📣 Avisos', '📝 Última nota', '📚 Todas las notas',
                    '🗓 ¿Faltó?', '🤒 Avisar falta', '🧮 Boleta del parcial',
                    '💰 Pagos', '🧾 Recibos', '📔 Bitácora', '🙂 Conducta', '🏠 ¿Cómo ayudo?',
                    '💡 Consejo', '🔄 Actualizar', '🔑 Cambiar clave'];
/* Con más de una clave guardada aparece el conmutador de hijos */
function chipsMenu() {
  return cfgCodigos().length > 1 ? ['👧 Cambiar de hijo'].concat(CHIPS_BASE) : CHIPS_BASE;
}

/* ── tarjetas de nota ── */
function notaCardHTML(r) {
  const esNSP = !!r.nsp;
  const p = pctDe(r);
  const val = esNSP ? 'NSP' : (r.nota == null ? '—' : r.nota + '/' + (r.base || 100));
  const ok = p !== null && p >= 70;
  const formaTxt = (r.forma && !String(r.evaluacion || '').includes('Forma')) ? ' · Forma ' + esc(r.forma) : '';
  const parcialTxt = r.parcial ? ' · Parcial ' + esc(r.parcial) : '';
  /* la fecha que importa es la de la prueba (la escribió el alumno); si no vino, la del análisis */
  const f = r.fecha_prueba ? '📅 Prueba: ' + fmtFecha(r.fecha_prueba) : fmtFecha(r.fecha);
  return '<div class="nota-card">' +
    '<div class="nc-top"><span class="nc-eval">' + esc(r.evaluacion || 'Evaluación') + '</span>' +
    '<span class="nc-val ' + (esNSP || !ok ? 'baja' : 'ok') + '">' + val + (ok ? ' ✔' : '') + '</span></div>' +
    '<div class="nc-meta">' + esc(r.categoria || '') + parcialTxt + formaTxt + (f ? ' · ' + f : '') +
    (r.docente ? ' · ' + esc(r.docente) : '') + '</div></div>';
}
function msjMaestroHTML(r) {
  if (!r || !r.mensaje) return '';
  return '<div class="msj-maestro">💬 <em>Mensaje del maestro:</em><br>' + linkify(esc(r.mensaje)) + '</div>';
}
function avisoCache() {
  return ROWS_CACHE && ROWS_FECHA
    ? '<br><small>📴 (datos guardados el ' + fmtFecha(ROWS_FECHA) + ' — toque «🔄 Actualizar» con internet)</small>'
    : '';
}
/* Fecha del último dato que subió el maestro (la nube ya la manda:
   actualizado_en en lo administrativo, fecha en el plan) */
function fechaCorte() {
  let max = '';
  (ROWS || []).concat(ROWS_AD || [], ROWS_AV || []).forEach(r => {
    const f = String(r.actualizado_en || r.fecha || '');
    if (f && f > max) max = f;
  });
  return max;
}
/* Sello de frescura: cada respuesta dice de cuándo son los datos, y si el
   maestro lleva mucho sin publicar, se avisa en vez de afirmar con datos viejos */
function selloDatos() {
  const f = fechaCorte();
  if (!f) return avisoCache();
  const d = new Date(f);
  const dias = isNaN(d) ? 0 : Math.floor((Date.now() - d.getTime()) / 86400000);
  const sello = dias > 21
    ? '<br><small>⚠️ El maestro no publica desde el ' + fmtFecha(f) + ' — si algo no cuadra, confirme en la escuela.</small>'
    : '<br><small>🕐 Datos del maestro al ' + fmtFecha(f) + '</small>';
  return sello.concat(avisoCache());
}

function sbCfg() {
  let url = SB_URL_DEF, key = SB_KEY_DEF;
  try {
    url = localStorage.getItem('METAS_SB_URL') || url;
    key = localStorage.getItem('METAS_SB_KEY') || key;
  } catch (_) {}
  return { url, key };
}

/* ── consulta a la nube (plan de acción + registros administrativos) ── */
/* Si el maestro corrigió un análisis (lo rehizo o cambió un nº de lista),
   la nube puede traer la misma evaluación dos veces. Aquí se queda solo
   la versión MÁS RECIENTE de cada una (evaluación + tipo + parcial) para
   no confundir al padre. La nube ya deduplica; esto cubre datos viejos
   guardados en el teléfono. */
function dedupePlan(rows) {
  const orden = (Array.isArray(rows) ? rows.slice() : [])
    .sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
  /* Una fila vieja SIN parcial (guardada antes del arreglo del 16 jul)
     es la MISMA evaluación que su corrección con parcial: debe ceder,
     no sumarse como prueba aparte. */
  const conParcial = new Set();
  orden.forEach(r => {
    if (norm(r.parcial || '')) conParcial.add([norm(r.evaluacion || ''), norm(r.tipo || '')].join('|'));
  });
  const vistas = new Set();
  return orden.filter(r => {
    const base = [norm(r.evaluacion || ''), norm(r.tipo || '')].join('|');
    if (!norm(r.parcial || '') && conParcial.has(base)) return false;
    const k = base + '|' + norm(r.parcial || '');
    if (vistas.has(k)) return false;
    vistas.add(k);
    return true;
  });
}
function _desdeCache(codigo) {
  const c = cacheLoad(codigo);
  if (c && ((Array.isArray(c.rows) && c.rows.length) || (Array.isArray(c.admin) && c.admin.length) ||
            (Array.isArray(c.avisos) && c.avisos.length))) {
    ROWS = dedupePlan(c.rows);
    ROWS_AD = Array.isArray(c.admin) ? c.admin : [];
    ROWS_AV = Array.isArray(c.avisos) ? c.avisos : [];
    ROWS_FECHA = c.t; ROWS_CACHE = true;
    return true;
  }
  return false;
}
async function consultar(codigo) {
  ROWS = null; ROWS_AD = null; ROWS_AV = null; ROWS_CACHE = false; ROWS_FECHA = null;
  /* datos frescos = Bitácora desde el principio; si no, al cambiar de hijo
     o actualizar, «Más antiguas» saltaría las anotaciones nuevas sin mostrarlas */
  _bitDesde = 0;
  if (navigator.onLine === false) return _desdeCache(codigo) ? 'cache' : 'offline';
  try {
    const { url, key } = sbCfg();
    /* Si el servidor falla (r.ok false) NO se disfraza de «sin datos»:
       así el bot no le echa la culpa a la clave del padre. */
    const pide = fn => fetch(url + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'apikey': key, 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_codigo: codigo }),
    }).then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
    const seguro = p => p.then(v => ({ ok: true, v })).catch(() => ({ ok: false, v: [] }));
    const [plan, admin, avisos] = await Promise.all([
      seguro(pide('metas_consultar_plan_padre')),
      seguro(pide('metas_consultar_admin_padre')),
      seguro(pide('metas_consultar_avisos_padre')),   /* si aún no existe en la nube, se tolera */
    ]);
    const rows = dedupePlan(plan.v);
    const adm  = Array.isArray(admin.v) ? admin.v : [];
    const avs  = Array.isArray(avisos.v) ? avisos.v : [];
    if (!rows.length && !adm.length && !avs.length) {
      if (!plan.ok || !admin.ok) return _desdeCache(codigo) ? 'cache' : 'error';
      return 'vacio';
    }
    ROWS = rows; ROWS_AD = adm; ROWS_AV = avs; ROWS_FECHA = new Date().toISOString();
    cacheSave(codigo, rows, adm, avs);
    return 'ok';
  } catch (_) {
    return _desdeCache(codigo) ? 'cache' : 'error';
  }
}

/* Asegura que hay datos antes de responder; devuelve true si los hay */
async function conDatos() {
  const codigo = claveGuardada();
  if (!codigo) {
    await botSay('Primero necesito la <strong>clave de la familia</strong> 🔑 (la tira que le entregó el maestro, ej. <strong>15-K7QM</strong>). Escríbala aquí abajo.',
      ['❓ ¿Qué es la clave?']);
    return false;
  }
  if (ROWS !== null && (ROWS.length || (ROWS_AD && ROWS_AD.length) || (ROWS_AV && ROWS_AV.length))) return true;
  await botSay('⏳ Un momento, consulto las notas de la clave <strong>' + esc(claveBonita(codigo)) + '</strong>…');
  const st = await consultar(codigo);
  if (st === 'ok' || st === 'cache') return true;
  if (st === 'vacio') {
    await botSay('Aún no hay notas guardadas para la clave <strong>' + esc(claveBonita(codigo)) + '</strong>. ' +
      'Puede ser que el maestro todavía no las suba, o que la clave tenga un error. ' +
      'Verifíquela con la tira impresa o pregunte al maestro. 🙏',
      ['🔄 Actualizar', '🔑 Cambiar clave', '❓ ¿Qué es la clave?']);
    return false;
  }
  if (st === 'offline') {
    await botSay('📴 Ahorita no hay internet y todavía no tengo notas guardadas en este teléfono. ' +
      'Intente de nuevo cuando tenga conexión.', ['🔄 Actualizar']);
    return false;
  }
  await botSay('⚠️ No pude consultar la nube en este momento. Intente de nuevo en unos minutos.', ['🔄 Actualizar']);
  return false;
}

async function respResumen() {
  if (!await conDatos()) return;
  if (!ROWS.length) { await _sinPlan(); return; }
  const conNota = ROWS.filter(r => pctDe(r) !== null);
  const nsp = ROWS.filter(r => r.nsp).length;
  const aprob = conNota.filter(r => pctDe(r) >= 70).length;
  let html = '';
  if (!conNota.length) {
    html = 'Por ahora hay <strong>' + ROWS.length + '</strong> registro(s), pero sin nota numérica' +
      (nsp ? ' (' + nsp + ' con <strong>NSP</strong>: no se presentó)' : '') + '.';
  } else {
    const prom = Math.round(conNota.reduce((s, r) => s + pctDe(r), 0) / conNota.length);
    let veredicto;
    if (prom >= 90)      veredicto = '¡Va <strong>excelente</strong>! 🌟 Felicítenlo/a en casa.';
    else if (prom >= 80) veredicto = 'Va <strong>muy bien</strong> 💪 ¡Sigan así!';
    else if (prom >= 70) veredicto = 'Va <strong>bien</strong> ✔ — con apoyo en casa puede subir aún más.';
    else if (prom >= 60) veredicto = 'Necesita <strong>refuerzo</strong> ⚠️ — el repaso diario en casa hace la diferencia.';
    else                 veredicto = 'Necesita <strong>mucho apoyo</strong> ❗ Les recomiendo hablar con el maestro esta semana.';
    html = '📊 Tengo <strong>' + ROWS.length + '</strong> evaluación(es) registrada(s). ' +
      'Promedio: <strong>' + prom + '/100</strong>. Aprobadas: <strong>' + aprob + ' de ' + conNota.length + '</strong>' +
      (nsp ? ' · NSP: ' + nsp : '') + '.<br>' + veredicto;
  }
  const nAvisos = avDe(['aviso', 'evento', 'material', 'individual']).filter(r => !esBitacora(r)).length;
  if (nAvisos) html += '<br>📣 Tiene <strong>' + nAvisos + '</strong> aviso(s) del maestro — toque «📣 Avisos».';
  const nCond = avDe(['conducta']).length;
  if (nCond) html += '<br>📋 Tiene <strong>' + nCond + '</strong> reporte(s) de conducta — toque «🙂 Conducta».';
  const nRec = esRecibo.de(avDe(['cuentas'])).length;
  if (nRec) html += '<br>🧾 Tiene <strong>' + nRec + '</strong> recibo(s) de aporte — toque «🧾 Recibos».';
  const nBit = bitacoraTodas().length;
  if (nBit) html += '<br>📔 La <strong>Bitácora</strong> trae ' + nBit + ' anotación(es) de clase — toque «📔 Bitácora».';
  html += notaCardHTML(ROWS[0]) + selloDatos();
  await botSay(html, chipsMenu());
}

                      'En la misión del tema, que repita la <strong>práctica</strong> hasta sacar 70 o más.',
                      'Celebre cada avance pequeño: la confianza también se entrena. 💪'],
  'satisfactorio':   ['Va aprobando: ahora el reto es <strong>subir la nota</strong>. Practique el tema 2 veces por semana.',

                      'Anímelo/a a explicarle el tema a alguien de la casa: enseñar es la mejor forma de aprender.'],
  'avanzado':        ['¡Felicidades! 🌟 Su hijo/a domina el tema.',

function tipsDeCategoria(cat) {
  const c = norm(cat);
  for (const k in TIPS_CATEGORIA) if (c.includes(norm(k))) return TIPS_CATEGORIA[k];
  return ['Repasen el tema en casa 15 minutos al día y pregunten al maestro qué reforzar.'];
}

/* Palabras clave por materia: se emparejan al INICIO de palabra
   («mate» exacta cuenta, «materia» no) */
const MATERIAS = {
  'matemáticas': ['matematic', 'numero', 'multiplic', 'divis', 'fraccion', 'geometr', 'suma', 'resta', 'decimal', 'algebra'],
  'español':     ['espanol', 'lengua', 'lectura', 'ortografia', 'gramatica', 'verbo', 'sustantivo', 'comprension'],
  'ciencias naturales': ['naturales', 'ciencia', 'ecosistema', 'planta', 'animal'],
  'ciencias sociales':  ['sociales', 'historia', 'geografia', 'civica'],
  'inglés':      ['ingles', 'english'],
};
function materiaEn(txt) {
  const t = norm(txt);
  if (/\bmate\b/.test(t)) return 'matemáticas';
  for (const m in MATERIAS) {
    if (MATERIAS[m].some(k => new RegExp('\\b' + k).test(t))) return m;
  }
  return '';
}
async function respMateria(txt) {
  if (!await conDatos()) return;
  const nombre = materiaEn(txt);
  const claves = nombre ? MATERIAS[nombre] : null;
  if (!claves) return false;
  const filas = ROWS.filter(r => {
    const e = norm(r.evaluacion || '');
    return claves.some(k => e.includes(k)) || e.includes(norm(nombre));
  });
  if (!filas.length) {
    await botSay('No encuentro evaluaciones de <strong>' + esc(nombre) + '</strong> entre las notas registradas. ' +
      'Puede ver todas con «📚 Todas las notas».', chipsMenu());
  } else {
    await botSay('Esto tengo de <strong>' + esc(nombre) + '</strong>:' +
      filas.slice(0, 6).map(notaCardHTML).join('') + selloDatos(), chipsMenu());
  }
  return true;
}

/* ── registros administrativos (asistencia / notas finales / colaboraciones) ── */
function adFilas(tipo) { return (ROWS_AD || []).filter(r => r.tipo === tipo); }

async function respAsistencia() {
  if (!await conDatos()) return;
  const rs = adFilas('asistencia').filter(r => r.estado === 'ausente' || r.estado === 'excusa')
    .sort((a, b) => String(b.fecha) < String(a.fecha) ? -1 : 1);
  if (!rs.length) {
    const f = fechaCorte();
    await botSay('🗓 <strong>No tengo faltas registradas</strong>' +
      (f ? ' hasta el <strong>' + fmtFecha(f) + '</strong> (última publicación del maestro)' : ' por ahora') +
      '. El maestro anota solo las ausencias, así que eso es buena señal. 🎉' +
      '<br><small>Si su hijo/a faltó o va a faltar, toque «🤒 Avisar falta» y le aviso al maestro con día y razón.</small>' +
      selloDatos(), chipsMenu());
    return;
  }
  const aus = rs.filter(r => r.estado === 'ausente').length;
  const exc = rs.filter(r => r.estado === 'excusa').length;
  const lineas = rs.slice(0, 8).map(r =>
    '• ' + fmtFecha(r.fecha) + ' — ' + (r.estado === 'ausente' ? '🚫 ausente' : '📝 con excusa')).join('<br>');
  await botSay('🗓 Registro de faltas: <strong>' + aus + '</strong> ausencia(s)' +
    (exc ? ' y <strong>' + exc + '</strong> con excusa' : '') + '.<br>' + lineas +
    (rs.length > 8 ? '<br><small>(mostrando las 8 más recientes)</small>' : '') +
    '<br>Si una falta tiene justificación, toque <strong>«🤒 Avisar falta»</strong> y se la anoto al maestro con día y razón. 🙏' +
    selloDatos(), chipsMenu());
}

const PA_PERSONALIDAD = ['Puntualidad', 'Espíritu de trabajo', 'Orden y presentación', 'Sociabilidad', 'Moralidad'];
function esPersonalidad(m) { return PA_PERSONALIDAD.some(x => norm(x) === norm(m || '')); }
function esInasistencias(m) { return norm(m || '') === norm('Inasistencias'); }

async function respFinales(txt) {
  if (!await conDatos()) return;
  // Incluye académico (número), conducta (letra en `estado`) e inasistencias.
  const rs = adFilas('nota_final').filter(r => (typeof r.nota === 'number') || (r.estado && String(r.estado).trim()));
  if (!rs.length) {
    await botSay('🧮 El maestro todavía no sube <strong>notas finales de parcial</strong> para esta clave. ' +
      'Las notas de evaluaciones sueltas están en «📚 Todas las notas».', chipsMenu());
    return;
  }
  /* ¿preguntó por un parcial específico? */
  const t = norm(txt || '');
  const mapa = { '1': 'I', '2': 'II', '3': 'III', '4': 'IV', 'i': 'I', 'ii': 'II', 'iii': 'III', 'iv': 'IV' };
  let pedido = '';
  const m = t.match(/parcial\s*(iv|iii|ii|i|[1-4])/);
  if (m) pedido = mapa[m[1]] || '';
  const porParcial = {};
  rs.forEach(r => {
    const p = r.parcial || '?';
    (porParcial[p] = porParcial[p] || []).push(r);
  });
  const parciales = ['I', 'II', 'III', 'IV'].filter(p => porParcial[p] && (!pedido || p === pedido));
  if (!parciales.length) {
    await botSay('🧮 Aún no hay notas finales del <strong>Parcial ' + esc(pedido) + '</strong>. ' +
      'Parciales con notas: ' + esc(Object.keys(porParcial).join(', ')) + '.', chipsMenu());
    return;
  }
  const byMat = (a, b) => String(a.materia).localeCompare(String(b.materia));
  const linea = (nom, val, color) => '<div class="nc-meta" style="font-size:14px;margin-top:4px">' +
    esc(nom) + ': <strong style="color:' + color + '">' + esc(String(val)) + '</strong></div>';
  const html = parciales.map(p => {
    const filas = porParcial[p];

/* ── Guardar el recibo como FOTO ──
   El padre quiere el comprobante en su galería, no otra pantalla que abrir. Se
   dibuja a mano en un canvas (nada de librerías: este asistente pesa poco a
   propósito y abre sin señal) y se entrega por el camino que exista: compartir
   nativo si la app está instalada, descarga si el navegador la soporta, y en
   todo caso la imagen queda en la conversación para mantenerla presionada. */
function _recWrap(ctx, txt, max) {
  const lineas = [];
  String(txt || '').split('\n').forEach(parrafo => {
    let linea = '';
    parrafo.split(/\s+/).forEach(p => {
      const probar = linea ? linea + ' ' + p : p;
      if (ctx.measureText(probar).width > max && linea) { lineas.push(linea); linea = p; }
      else linea = probar;
    });
    lineas.push(linea);
  });
  return lineas;
}
function reciboPNG(r) {
  const folio = reciboFolio(r);
  const concepto = String(r.titulo || '').replace(/^🧾 Recibo \S+ — /, '') || 'Aporte';
  /* el monto ya viene dentro del texto del recibo: se saca para escribirlo
     GRANDE, que es lo que hace que una foto se lea como un recibo */
  const mm = String(r.texto || '').match(/:\s*(L\s*[\d.,]+)\s+por concepto/);
  const monto = mm ? mm[1] : '';
  const W = 900, PAD = 56, MAXT = W - PAD * 2;
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  const F = n => n + 'px system-ui, -apple-system, "Segoe UI", Arial, sans-serif';

  /* se miden TODAS las líneas antes de fijar el alto: si el pie no se envuelve,
     se sale de la foto y el recibo queda cortado */
  ctx.font = 'bold ' + F(31);
  const lConcepto = _recWrap(ctx, concepto, MAXT);
  ctx.font = F(25);
  const lCuerpo = _recWrap(ctx, r.texto || '', MAXT);
  ctx.font = F(22);
  const pie = [];
  if (folio) pie.push.apply(pie, _recWrap(ctx,
    'N.º de recibo: ' + folio + ' (no es una clave: es el número de este comprobante, como el de una factura).', MAXT));
  pie.push.apply(pie, _recWrap(ctx,
    'Emitido por el docente en M.E.T.A.S · metas.policastsapien.com', MAXT));

  const H = 132 + 64 + lConcepto.length * 40 + (monto ? 62 : 0) +
            (r.fecha_evento ? 44 : 0) + lCuerpo.length * 38 + 62 + pie.length * 32 + 30;
  cv.width = W; cv.height = H;

  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#1e7a44'; ctx.fillRect(0, 0, W, 132);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold ' + F(38); ctx.fillText('RECIBO DE APORTE', PAD, 62);
  ctx.font = F(23); ctx.fillText('M.E.T.A.S · Misiones Educativas', PAD, 100);

  let y = 132 + 64;
  ctx.fillStyle = '#0f2f1c'; ctx.font = 'bold ' + F(31);
  lConcepto.forEach(l => { ctx.fillText(l, PAD, y); y += 40; });
  if (monto) {
    ctx.fillStyle = '#1e7a44'; ctx.font = 'bold ' + F(48);
    ctx.fillText(monto, PAD, y + 34); y += 62;
  }
  if (r.fecha_evento) {
    ctx.fillStyle = '#1e7a44'; ctx.font = 'bold ' + F(25);
    ctx.fillText('Fecha: ' + fmtFecha(r.fecha_evento), PAD, y); y += 44;
  }
  ctx.fillStyle = '#1c2733'; ctx.font = F(25);
  lCuerpo.forEach(l => { ctx.fillText(l, PAD, y); y += 38; });

  y += 22;
  ctx.strokeStyle = '#d5dfd8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
  y += 38;
  ctx.fillStyle = '#5b6b7b'; ctx.font = F(22);
  pie.forEach(l => { ctx.fillText(l, PAD, y); y += 32; });
  return { url: cv.toDataURL('image/png'), nombre: 'recibo-' + (folio || 'aporte') + '.png' };
}
async function guardarRecibo(btn) {
  const folio = btn && btn.dataset.folio;
  const r = esRecibo.de(ROWS_AV || []).find(x => reciboFolio(x) === folio);
  if (!r) { await botSay('⚠️ No encontré ese recibo. Toque «🔄 Actualizar» y pruebe de nuevo.', chipsMenu()); return; }
  const txtOrig = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ Preparando…';
  let img;
  try { img = reciboPNG(r); }
  catch (_) {
    btn.disabled = false; btn.textContent = txtOrig;
    await botSay('⚠️ No pude armar la foto del recibo en este teléfono. ' +
      'Puede tomarle una <strong>captura de pantalla</strong> a la tarjeta de arriba.', chipsMenu());
    return;
  }
  let guardado = false;
  const cap = window.Capacitor;
  if (cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins && cap.Plugins.Filesystem && cap.Plugins.Share) {
    try {
      const res = await cap.Plugins.Filesystem.writeFile({
        path: img.nombre, data: img.url.split(',')[1], directory: 'CACHE' });
      await cap.Plugins.Share.share({ url: res.uri, dialogTitle: 'Guardar o compartir el recibo' });
      guardado = true;
    } catch (_) {}
  }
  if (!guardado) {
    try {
      const a = document.createElement('a');
      a.href = img.url; a.download = img.nombre;
      document.body.appendChild(a); a.click(); a.remove();
      guardado = true;
    } catch (_) {}
  }
  btn.disabled = false; btn.textContent = '📷 Guardar de nuevo';
  /* la imagen SIEMPRE queda en la conversación: en muchos teléfonos la descarga
     no avisa dónde cayó, y mantener presionada la foto es lo que el padre sabe hacer */
  await botSay('🧾 Este es su recibo como foto. ' +
    (guardado ? 'Ya se descargó; si no la encuentra, mantenga' : 'Mantenga') +
    ' <strong>presionada la imagen</strong> y elija «Guardar imagen» o «Descargar imagen» ' +
    'para que quede en su galería.' +
    '<img class="rec-img" src="' + img.url + '" alt="Recibo de aporte ' + esc(folio) + '">', chipsMenu());
}

/* ── BITÁCORA de la clase ──
   La escribe sola Mi aula: cada control que el maestro marcó «contarlo a la
   familia» (ficha entregada, material, libro…) y las novedades que él anota del
   día. Viajan por el canal de comunicados y se reconocen por el título, así que
   se excluyen de «📣 Avisos» para no contar dos veces lo mismo. */
function esBitacora(r) { return /^📔 Bitácora/.test(String(r && r.titulo || '')); }
esBitacora.de = arr => (arr || []).filter(esBitacora);
function bitacoraTodas() {
  return esBitacora.de(avDe(['individual', 'aviso']))
    .slice().sort((a, b) => String(b.fecha_evento || '').localeCompare(String(a.fecha_evento || '')));

function bitacoraCardHTML(r) {
  const titulo = String(r.titulo || '').replace(/^📔 Bitácora · /, '') || 'Novedad';
  /* La misión enlazada viaja en `claves` como «url|título». Hay rutas con
     espacios y acentos («…bisectriz_II y III-Ciclo_Básica.html»), así que no se
     puede exigir un path limpio: se acepta cualquier ruta RELATIVA (sin «:» que
     abriría javascript:, sin «/» inicial y sin «..») y se codifica al ponerla. */
  const par = String(r.claves || '').split('|');
  const crudo = par[0] || '';
  const url = (crudo && crudo.indexOf(':') < 0 && crudo[0] !== '/' && crudo.indexOf('..') < 0)
    ? encodeURI(crudo) : '';
  const nom = par[1] || 'la misión';
  return '<div class="nota-card"><div class="nc-top">' +
    '<span class="nc-eval">' + esc(titulo) + '</span>' +
    (r.fecha_evento ? '<span class="nc-val ok">' + fmtFecha(r.fecha_evento) + '</span>' : '') + '</div>' +
    '<div class="nc-meta" style="font-size:14px;margin-top:4px">' + linkify(esc(r.texto || '')) + '</div>' +
    (url ? '<a class="bit-mision" href="' + esc(url) + '" target="_blank" rel="noopener">' +
      '📚 Estudiar «' + esc(nom) + '»</a>' : '') +
    '</div>';
}
/* La Bitácora crece con cada día de clase. Si se pinta entera, la anotación
   nueva queda arriba de una pared de tarjetas viejas: se sirve por TANDAS de
   las más recientes, y «📔 Más antiguas» trae las que siguen. */
const BIT_TANDA = 5;
let _bitDesde = 0;   /* desde qué anotación sigue la próxima tanda */
async function respBitacora(desde) {
  if (!await conDatos()) return;
  const bit = bitacoraTodas();
  if (!bit.length) {
    await botSay('📔 La <strong>Bitácora</strong> está vacía por ahora. Aquí le iré contando lo que se ' +
      'anota en clase: cuándo le entregaron una ficha o material de estudio, si hay evaluación de por ' +
      'medio, y las novedades que el maestro escriba del día.', chipsMenu());
    return;
  }
  const d = Math.min(desde || 0, bit.length);
  const tanda = bit.slice(d, d + BIT_TANDA);
  if (!tanda.length) {
    _bitDesde = 0;
    await botSay('📔 Ya leyó la Bitácora completa: no hay anotaciones más viejas. ' +
      'Toque «📔 Bitácora» para volver a lo más reciente.', chipsMenu());
    return;
  }
  _bitDesde = d + tanda.length;
  const quedan = bit.length - _bitDesde;
  const titulo = d
    ? '📔 <strong>Bitácora</strong> — anotaciones más viejas:'
    : '📔 <strong>Bitácora de la clase</strong>, lo más reciente primero:';
  await botSay(titulo +
    tanda.map(bitacoraCardHTML).join('') +
    (quedan > 0
      ? '<br><small>Van ' + _bitDesde + ' de ' + bit.length +
        ' anotaciones — toque «📔 Más antiguas» para seguir leyendo.</small>'
      : (d ? '<br><small>Hasta aquí llega la Bitácora.</small>' : '')) +
    (d ? '' :
      '<br><small>Cuando aparezca el botón <strong>📚 Estudiar</strong>, ábralo con su hijo/a: es la misma ' +
      'misión del tema de esa ficha, con práctica y evaluación en el teléfono.</small>') +
    selloDatos(),
    quedan > 0 ? ['📔 Más antiguas'].concat(chipsMenu()) : chipsMenu());
}

/* Ficha del aula: busca la pregunta del maestro que más se parece a la
   del padre (≥2 palabras en común de 4+ letras, o 1 palabra larga) */
const FAQ_STOP = ['como', 'cuando', 'donde', 'cual', 'cuales', 'para', 'porque',
                  'hijo', 'hija', 'nino', 'nina', 'debe', 'hace', 'esta', 'este', 'tiene'];
function faqMatch(t) {
  const faqs = avDe(['faq']);
  if (!faqs.length) return null;
  const palabras = String(t || '').split(' ').filter(w => w.length >= 4 && FAQ_STOP.indexOf(w) < 0);
  let mejor = null, mejorScore = 0;
  faqs.forEach(f => {
    const bolsa = norm((f.pregunta || '') + ' ' + (f.claves || ''));
    let score = 0, larga = false;
    palabras.forEach(w => { if (bolsa.indexOf(w) >= 0) { score++; if (w.length >= 6) larga = true; } });
    if ((score >= 2 || (score >= 1 && larga)) && score > mejorScore) { mejor = f; mejorScore = score; }
  });
  return mejor;
}
/* Marca (sin esperar respuesta) qué avisos vio esta familia: el maestro
   ve «visto por N familias» en su pestaña Comunicados */
function avMarcarVistos(avs) {
  const codigo = claveGuardada();

        body: JSON.stringify({ p_codigo: codigo, p_evento_id: a.evento_id }),
      }).catch(() => {});
    } catch (_) {}
  });
}

/* ── buzón padre → maestro (excusas y recados, con tope diario) ── */
let _buzonPendiente = null;    /* texto listo para enviar con un toque */
let _buzonEsperando = false;   /* el siguiente mensaje del padre ES el recado */
async function buzonEnviar(texto, vista) {
  const codigo = claveGuardada();
  const limpio = String(texto || '').trim().slice(0, 300);
  if (!codigo) {
    await botSay('Primero necesito la <strong>clave de la familia</strong> 🔑 para saber a qué maestro dejarle el recado.', ['❓ ¿Qué es la clave?']);
    return;
  }
  if (!limpio || limpio.length < 3) {
    await botSay('El mensaje quedó vacío 😅. Escríbalo de nuevo, por favor.', chipsMenu());
    return;
  }
  if (navigator.onLine === false) {
    await botSay('📴 Ahorita no hay internet, así que no puedo entregar el recado. Inténtelo cuando tenga conexión. 🙏', chipsMenu());
    return;
  }
  const { url, key } = sbCfg();
  let v = 'error';
  try {
    const r = await fetch(url + '/rest/v1/rpc/metas_mensaje_padre', {
      method: 'POST',
      headers: { 'apikey': key, 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_codigo: codigo, p_texto: limpio }),
    });
    if (r.ok) v = await r.json();
  } catch (_) {}
  _buzonPendiente = null;
  if (v === 'ok') {
    await botSay('📨 <strong>Anotado.</strong> El maestro verá su mensaje en la bandeja de su aula:<br>' +
      '<em>«' + esc(vista || limpio) + '»</em><br><small>Si necesita respuesta, el maestro puede contestarle con un aviso.</small>', chipsMenu());
  } else if (v === 'tope') {
    await botSay('✋ Ya se enviaron <strong>5 mensajes hoy</strong> con esta clave (es el máximo diario). ' +
      'Mañana puede enviar más; si es urgente, busque al maestro en la escuela.', chipsMenu());
  } else {
    await botSay('⚠️ No pude entregar el recado en este momento. Inténtelo de nuevo en unos minutos.', chipsMenu());
  }
}

/* ── excusa guiada: día + razón → el maestro la marca con UN toque ──
   El mensaje viaja con el marcador [EXCUSA YYYY-MM-DD] para que la
   bandeja de Mi aula ofrezca «✔ Marcar con excusa» en el pase de lista
   del alumno de ESTA clave. */
let _excusa = null;   /* { paso: 'dia'|'razon', dia: 'YYYY-MM-DD' } */
function _fechaISO(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}
function excusaParseDia(t) {
  const hoy = new Date();
  if (/manana/.test(t)) { const d = new Date(hoy); d.setDate(d.getDate() + 1); return _fechaISO(d); }
  if (/ayer/.test(t))   { const d = new Date(hoy); d.setDate(d.getDate() - 1); return _fechaISO(d); }
  if (/hoy/.test(t))    return _fechaISO(hoy);
  const m = String(t).match(/(\d{1,2})[\/\- ](\d{1,2})(?:[\/\- ](\d{2,4}))?/);
  if (m) {
    let y = m[3] ? +m[3] : hoy.getFullYear();
    if (y < 100) y += 2000;
    const d = new Date(y, +m[2] - 1, +m[1]);
    if (!isNaN(d) && +m[1] >= 1 && +m[1] <= 31 && +m[2] >= 1 && +m[2] <= 12) return _fechaISO(d);
  }
  return '';
}
async function excusaIniciar() {
  if (!claveGuardada()) {
    await botSay('Para avisar una falta primero necesito la <strong>clave de la familia</strong> 🔑 (así sé de qué alumno/a se trata).', ['❓ ¿Qué es la clave?']);
    return;
  }
  _excusa = { paso: 'dia', dia: '' };
  await botSay('🤒 Vamos a avisarle la falta al maestro. <strong>¿Qué día</strong> faltó o va a faltar su hijo/a?<br>' +
    '<small>Toque un botón o escriba la fecha (ej. 15/07).</small>',
    ['📅 Hoy', '📅 Ayer', '📅 Mañana', '🚫 Cancelar']);
}
async function excusaPaso(txtOriginal) {
  const t = expand(norm(txtOriginal));
  if (/cancelar|ya no|mejor no/.test(t)) {
    _excusa = null;
    await botSay('De acuerdo 👍 No se avisó nada.', chipsMenu());
    return;
  }
  if (_excusa.paso === 'dia') {
    const dia = excusaParseDia(t);
    if (!dia) {
      await botSay('No entendí el día 😅. Toque un botón o escriba la fecha como <strong>15/07</strong>.',
        ['📅 Hoy', '📅 Ayer', '📅 Mañana', '🚫 Cancelar']);
      return;
    }
    _excusa.dia = dia; _excusa.paso = 'razon';
    await botSay('📅 <strong>' + fmtFecha(dia) + '</strong>. ¿Y <strong>cuál es la razón</strong>? Toque una o escríbala:',
      ['🤒 Enfermedad', '🩺 Cita médica', '👨‍👩‍👧 Asunto familiar', '🚫 Cancelar']);
    return;
  }
  const razon = String(txtOriginal).replace(/^[^0-9A-Za-zÁ-úá-ú]+/, '').trim().slice(0, 200) || 'Sin razón indicada';
  const dia = _excusa.dia;
  _excusa = null;
  await buzonEnviar('[EXCUSA ' + dia + '] ' + razon,
    '🤒 Falta del ' + fmtFecha(dia) + ' — ' + razon);
}

/* ── accesibilidad: leer en voz alta y modo corto ── */
function leerBurbuja(btn) {
  try {

    const texto = (btn.parentNode.textContent || '').replace(/🔊/g, ' ').trim();

    u.lang = 'es-MX'; u.rate = 0.95;

}

/* Identidad de la clave: con qué alumno/grupo/maestro cuadran los datos,
   para que la familia confirme que la tira es la de SU hijo/a */
function identidadClave(codigo) {
  const num = (String(codigo).match(/^(\d+)/) || [])[1] || '';
  let grupo = '', doc = '';
  (ROWS || []).concat(ROWS_AD || []).forEach(r => {
    if (!grupo) grupo = r.grupo || grupoTxt(r.grado, r.seccion);
    if (!doc) doc = r.docente || '';
  });
  return { num, grupo: String(grupo).trim(), doc: String(doc).trim() };
}

async function usarClave(codigo) {
  const c = cfgLoad();
  c.codigo = codigo;
  if (!Array.isArray(c.codigos)) c.codigos = [];
  if (!c.codigos.some(x => x.codigo === codigo)) c.codigos.push({ codigo, alias: '' });
  cfgSave(c);
  ROWS = null;
  await botSay('🔑 Clave <strong>' + esc(claveBonita(codigo)) + '</strong> guardada. Consultando la nube…');
  const st = await consultar(codigo);
  if (st === 'ok' || st === 'cache') {
    /* confirmación de identidad: que la familia verifique la tira */
    const idn = identidadClave(codigo);
    if (idn.num) {
      const alias = '#' + idn.num + (idn.grupo ? ' de ' + idn.grupo : '');
      const c2 = cfgLoad();
      const e = (c2.codigos || []).find(x => x.codigo === codigo);
      if (e && !e.alias) { e.alias = alias; cfgSave(c2); }
      await botSay('✅ Los datos de esta clave son del <strong>alumno/a ' + esc(alias) + '</strong>' +
        (idn.doc ? ', con el/la docente <strong>' + esc(idn.doc) + '</strong>' : '') +
        '. Si no es su hijo/a, revise la tira y toque «🔑 Cambiar clave».');
    }
    await respResumen(); await sugerirInstalar(); return;
  }
  if (st === 'vacio') {
    const sospecha = /[01ILO]/.test(String(codigo).replace(/^\d+/, ''));
    await botSay('La clave quedó guardada, pero <strong>aún no hay notas</strong> para ella. ' +
      'Puede ser que el maestro no las haya subido todavía, o que un carácter esté equivocado — compare con la tira impresa. ' +
      (sospecha ? '<br>🔍 <strong>Ojo:</strong> las claves nunca usan <strong>0, 1, I, L</strong> ni <strong>O</strong> — revise justo esos caracteres. ' : '') +
      'Toque «🔄 Actualizar» más tarde.', ['🔄 Actualizar', '🔑 Cambiar clave']);
  } else if (st === 'offline') {
    await botSay('📴 No hay internet en este momento. La clave quedó guardada; toque «🔄 Actualizar» cuando tenga conexión.',
      ['🔄 Actualizar']);
  } else {
    await botSay('⚠️ No pude consultar la nube. Intente «🔄 Actualizar» en unos minutos.', ['🔄 Actualizar']);
  }
}

const MENU_NUM = [respResumen, respUltima, respTodas, respAsistencia,

const MENU_TXT = 'Escriba el <strong>número</strong> de lo que necesita:<br>' +

/* Pistas parciales: si la frase no entendida trae un fragmento reconocible
   («pagand», «faltas de mi niña»…), se sugiere el chip probable antes del menú */
const PISTAS = [
  /* el recibo va primero: «comprobante de pago» trae «pag» y se iría a la

  [/bitacora|novedad|ficha|diario/, '📔 Bitácora'],

  [/pag|deb|cuot|colect|aport|diner|pisto|lempir|cobr/, '💰 Pagos'],

];
/* Preguntas que no se entendieron: se guardan en el teléfono para que el
   proyecto sepa QUÉ preguntan los padres de verdad (materia prima de FAQs) */
function guardarNoEntendida(txt) {
  try {
    const K = 'METAS_PADRE_NOENT_V1';
    const arr = JSON.parse(localStorage.getItem(K) || '[]');
    arr.push({ q: String(txt).slice(0, 140), t: new Date().toISOString() });
    localStorage.setItem(K, JSON.stringify(arr.slice(-100)));
  } catch (_) {}
}

async function manejar(txtOriginal) {
  /* ¿vamos a la mitad del aviso de falta? (día → razón) */
  if (_excusa) { await excusaPaso(txtOriginal); return; }
  /* ¿estamos esperando el texto de un recado para el maestro? */
  if (_buzonEsperando) {
    _buzonEsperando = false;
    if (/cancelar|🚫|ya no|mejor no/i.test(txtOriginal)) {
      await botSay('De acuerdo 👍 No se envió nada.', chipsMenu());
      return;
    }
    await buzonEnviar(txtOriginal);
    return;
  }
  const clave = pareceClave(txtOriginal);
  if (clave) { await usarClave(clave); return; }
  /* casi-clave: trae 0, 1, I, L u O — caracteres que nunca usamos */
  const casi = casiClave(txtOriginal);
  if (casi) {
    await botSay('🔍 Eso <strong>casi</strong> es una clave, pero las claves nunca usan ' +
      '<strong>0, 1, I, L</strong> ni <strong>O</strong> (se confunden entre sí). ' +
      'Mire la tira con calma: ¿será una <strong>Q</strong> en vez de O, o un <strong>7</strong> en vez de 1? ' +
      'Escríbala de nuevo tal como aparece impresa. 🙏', ['❓ ¿Qué es la clave?']);
    return;
  }

  /* norm + expand: «q debe mi ijo» → «que debe mi hijo» */
  const t = expand(norm(txtOriginal));
  if (!t) return;

  /* respuesta con número del menú (1-9) */
  if (/^[1-9]$/.test(t)) { await MENU_NUM[+t - 1](t); return; }

  if (/respuestas cortas|modo corto|mas corto|muy largo/.test(t)) {
    const c = cfgLoad(); c.corto = 1; cfgSave(c);
    try { document.body.classList.add('corto'); } catch (_) {}
    await botSay('✂️ Listo: desde ahora las respuestas van <strong>más cortas</strong> (sin letra pequeña). ' +
      'Escriba «respuestas completas» para volver.', chipsMenu());
    return;
  }
  if (/respuestas completas|modo completo|respuestas largas/.test(t)) {
    const c = cfgLoad(); delete c.corto; cfgSave(c);
    try { document.body.classList.remove('corto'); } catch (_) {}
    await botSay('📄 Listo: respuestas completas de nuevo.', chipsMenu());
    return;
  }
  if (/instalar|pantalla de inicio|dejar como app/.test(t)) {
    if (_pwaPrompt) {
      const p = _pwaPrompt; _pwaPrompt = null;
      p.prompt();
      await botSay('📲 Siga las instrucciones de su teléfono y el asistente quedará en su pantalla de inicio.', chipsMenu());
    } else {
      await botSay('📲 En el menú del navegador (⋮) toque «<strong>Agregar a pantalla de inicio</strong>». ' +
        'Si ya lo instaló, ¡no necesita nada más! 🤗', chipsMenu());
    }
    return;
  }
  /* buzón: enviar lo pendiente con un toque, o componer un recado */
  if (/dejarsela al maestro|dejarselo al maestro|si dejar|anotar la excusa/.test(t)) {
    if (_buzonPendiente) { await buzonEnviar(_buzonPendiente); return; }
    _buzonEsperando = true;
    await botSay('Claro 📨. Escriba el mensaje para el maestro (máximo 300 letras):', ['🚫 Cancelar']);
    return;
  }
  if (/dile al maestro|digale al maestro|mensaje (para|al) maestr|dejar(le)? (un )?(mensaje|recado)|recado|avisarle al maestro|avisale al maestro/.test(t)) {
    _buzonEsperando = true;
    await botSay('Claro 📨. Escriba el mensaje que quiere dejarle al maestro (máximo 300 letras) y yo se lo anoto en su bandeja:', ['🚫 Cancelar']);
    return;
  }
  if (/cambiar de (hijo|hija|nino|nina)|otro hijo|otra hija|mis hijos|el otro nino|la otra nina/.test(t)) { await respCambiarHijo(); return; }
  if (/(cambiar|otra|nueva|borrar).*(clave|codigo)|cambiar clave/.test(t)) { await respCambiarClave(); return; }
  if (/(que es|donde|cual|como consigo|no tengo).*(clave|codigo)/.test(t) || t === 'clave' || t === 'codigo') { await respQueEsClave(); return; }
  if (/actualizar|refrescar|consultar|de nuevo|recargar/.test(t)) {
    ROWS = null;
    if (await conDatos()) await respResumen();
    return;
  }
  /* conducta ANTES que notas (el dato viaja dentro de las notas finales) */
  if (/conducta|comporta|se porta|disciplin|puntualidad|moralidad|sociabilidad|orden y presentacion/.test(t)) { await respConducta(t); return; }
  /* el recibo ANTES que el dinero en general: quien pide «mi recibo» o cita un
     folio quiere el comprobante de lo que YA entregó, no la lista de pendientes */
  if (/recibo|comprobante|\bfolio\b|constancia de (pago|aporte)|respaldo del (pago|aporte)/.test(t)) {
    await respRecibos(); return;
  }
  /* dinero ANTES que faltas: «cuánto falta pagar» es economía, no asistencia */
  if (!/tarea/.test(t) &&
      /colaboracion|aporte|cuota|colecta|deuda|dinero|pisto|lempira|cobr|\bpag(o|ar|ue|os|amos)\b|\bdeb(o|e|en|emos)\b(?! mejorar)|cuanto (hay que pagar|se paga|es|cuesta)|pendiente/.test(t)) {
    await respEconomia(); return;
  }
  /* la Bitácora ANTES de avisos y materiales: «la ficha» y «qué hicieron hoy»
     son diario de clase, no un aviso ni la lista de útiles */
  if (/mas antiguas|mas viejas/.test(t)) { await respBitacora(_bitDesde); return; }
  if (/bitacora|novedad|diario de (la )?clase|\bfichas?\b|material de estudio|que hicieron (hoy|en clase)|que paso en (la )?clase/.test(t)) {
    await respBitacora(); return;
  }
  /* comunicados del maestro: avisos y eventos, materiales, ficha del aula */
  if (/aviso|comunicad|anuncio|reunion|junta|convocatoria|evento|acto civico|suspend/.test(t)) { await respAvisos(); return; }
  if (/material|utiles|mochila|\bque lleva\b|que hay que (llevar|traer)|\btraer\b|\bllevar\b/.test(t)) { await respMateriales(); return; }
  if (/horario|hora de (salida|entrada)|a que hora (entra|sale)|uniforme|matricul|traslado|reposicion|\brepone/.test(t)) {
    if (await respFicha(t)) return;
    guardarNoEntendida(txtOriginal);
    await botSay('Esa pregunta se responde con la <strong>ficha del aula</strong> que llena el maestro, ' +
      'y la de su grupo todavía no tiene esa respuesta. Puedo ayudarle con esto: 👇', chipsMenu());
    return;
  }
  /* REPORTE de ausencia (el padre avisa) va ANTES que la CONSULTA de
     faltas: «falto ayer xq estaba enfermo» no es una pregunta.
     Se abre el aviso guiado: día + razón → el maestro la marca con un
     toque como CON EXCUSA en su pase de lista. */
  if (/avisar (la |una )?falta|avisar (la |una )?ausencia|reportar (falta|ausencia)|justificar|mandar (la )?excusa|dar excusa/.test(t)) {
    await excusaIniciar(); return;
  }
  if (/(esta|anda|amanecio) enferm|no (va a|pudo|puede|podra) (ir|venir|llegar|asistir)|no fue (hoy|ayer|a clases?)|falto (hoy|ayer)|va a faltar|no asistira|no ira (hoy|manana)|tiene (cita|consulta) (medica|con el doctor)/.test(t)) {
    await botSay('Entiendo 🙏 Que se mejore pronto. ¿Quiere <strong>avisarle la falta</strong> al maestro, ' +
      'para que quede <strong>con excusa</strong> en su pase de lista?',
      ['🤒 Sí, avisar la falta', '🚫 No, gracias']);
    return;
  }
  if (/falto|falta|asisten|ausen|inasist|llego a clase/.test(t)) { await respAsistencia(); return; }
  if (/nota.? final|finales|sace|boleta|\bparcial\b/.test(t)) { await respFinales(t); return; }
  if (materiaEn(t)) { await respMateria(t); return; }
  if (/ultima|ultimo|reciente|\bque saco\b|cuanto saco|nota nueva/.test(t)) { await respUltima(); return; }
  if (/como va|como esta|como le va|resumen|avance|progreso|rendimiento|promedio/.test(t)) { await respResumen(); return; }
  if (/todas|historial|lista de notas|calificaciones|ver notas|las notas|notas/.test(t)) { await respTodas(); return; }
  if (/aprobo|aprobado|aproband|aplaz|paso o no|reprobo|perdio|gano la|pas(a|o|ar) (de grado|el ano|el grado)/.test(t)) { await respAprobo(); return; }
  if (/consejo|tip|recomendacion/.test(t)) { await respConsejo(); return; }
  if (/ayud|apoyar|en casa|reforzar|practicar|repasar|mejorar|que hacer|que hago/.test(t)) { await respAyudarCasa(); return; }
  if (/maestro|maestra|profesor|profesora|profe|docente|quien califica/.test(t)) { await respMaestro(); return; }
  if (/\bnsp\b|no se presento/.test(t)) {
    const fNsp = avDe(['faq']).find(f => /nsp|repone/.test(norm((f.pregunta || '') + ' ' + (f.claves || ''))));
    await botSay('<strong>NSP</strong> significa «No Se Presentó»: el estudiante no hizo esa evaluación. ' +
      (fNsp ? '<br>📖 <strong>Para reponerla:</strong> ' + esc(fNsp.texto)
            : 'Hable con el maestro para ver cómo reponerla. 🙏'), chipsMenu());
    return;
  }
  if (/que es metas|que es m e t a s|que es esta pagina|que es la app/.test(t)) {
    await botSay('📚 <strong>M.E.T.A.S</strong> son misiones educativas gratuitas alineadas al currículo de Honduras: ' +
      'su hijo/a estudia, practica y se evalúa desde cualquier teléfono, incluso sin internet. ' +
      'Este asistente le muestra a usted las notas que registra el maestro. ' +
      '<a href="index.html">Abrir la app</a> 🚀', chipsMenu());
    return;
  }
  if (/hola|buenas|buenos dias|buenas tardes|buenas noches|saludos/.test(t)) {
    await botSay('¡Hola! 👋 Estoy para servirle. Puede tocar un botón o escribir su pregunta.', chipsMenu());
    return;
  }
  if (/gracias|muy amable|excelente|perfecto|ok|vale|adios|hasta luego/.test(t)) {
    await botSay('¡Con mucho gusto! 🤗 Su acompañamiento en casa es la mitad del éxito. Aquí estaré cuando me necesite.', chipsMenu());
    return;
  }
  /* ¿la ficha del aula responde esto? (solo con datos ya cargados:
     no se consulta la nube nada más para decir «No entendí») */
  if (ROWS_AV && ROWS_AV.length) {
    const f = faqMatch(t);
    if (f) {
      await botSay('📖 <strong>' + esc(f.pregunta) + '</strong><br>' + linkify(esc(f.texto || '')) + selloDatos(), chipsMenu());
      return;
    }
  }
  /* no entendido: se guarda la pregunta, se ofrece el menú numerado y
     el botón de dejársela anotada al maestro (nada se pierde) */
  guardarNoEntendida(txtOriginal);
  if (!claveGuardada()) {
    await botSay('No entendí 😅. Si ya tiene la <strong>clave de la familia</strong> (ej. 15-K7QM), escríbala tal cual. ' +
      'Si no la tiene, toque el botón de abajo.', ['❓ ¿Qué es la clave?']);
  } else {
    _buzonPendiente = txtOriginal;
    const pista = PISTAS.find(p => p[0].test(t));
    if (pista) {
      await botSay('No entendí bien 😅, pero creo que pregunta por <strong>' +
        esc(pista[1].replace(/^\S+\s/, '')) + '</strong> — toque el primer botón si es así. ' +
        'También puede escribir el número:<br>' + MENU_TXT,
        [pista[1], '📨 Dejársela al maestro'].concat(chipsMenu().filter(c => c !== pista[1])));
    } else {
      await botSay('No entendí esa pregunta 😅. ' + MENU_TXT +
        '<br>O toque «📨 Dejársela al maestro» y él la verá en su bandeja.',
        ['📨 Dejársela al maestro'].concat(chipsMenu()));
    }
  }
}

/* ── novedades desde la última visita (diff contra el caché anterior) ── */
function _sigSet(arr, fn) { const s = new Set(); (arr || []).forEach(r => s.add(fn(r))); return s; }
async function novedadesDesde(prev) {
  if (!prev) return;
  const sigN = r => [r.evaluacion, r.materia, r.fecha, r.nota, r.nsp ? 1 : ''].join('|');
  const sigA = r => [r.tipo, r.fecha, r.parcial, r.materia, r.nota, r.estado, r.concepto, r.monto].join('|');
  const sigV = r => [r.subtipo, r.titulo, r.texto, r.pregunta].join('|');
  const vN = _sigSet(prev.rows, sigN), vA = _sigSet(prev.admin, sigA), vV = _sigSet(prev.avisos, sigV);
  const notas = (ROWS || []).filter(r => !vN.has(sigN(r)));
  const faltas = (ROWS_AD || []).filter(r => r.tipo === 'asistencia' &&
    (r.estado === 'ausente' || r.estado === 'excusa') && !vA.has(sigA(r)));
  const otrosAd = (ROWS_AD || []).filter(r => r.tipo !== 'asistencia' && !vA.has(sigA(r)));
  const avisos = avDe(['aviso', 'evento', 'material', 'individual'])
    .filter(r => !esBitacora(r) && !vV.has(sigV(r)));
  const bitac = bitacoraTodas().filter(r => !vV.has(sigV(r)));
  const conducta = avDe(['conducta']).filter(r => !vV.has(sigV(r)));
  const recibos = esRecibo.de(avDe(['cuentas'])).filter(r => !vV.has(sigV(r)));
  const partes = [];
  if (bitac.length) partes.push(bitac.length + ' anotación(es) en la Bitácora');
  if (recibos.length) partes.push(recibos.length + ' recibo(s) de aporte');
  if (conducta.length) partes.push(conducta.length + ' reporte(s) de conducta');
  if (notas.length) {
    const mats = notas.map(r => r.materia).filter(Boolean)
      .filter((m, i, a) => a.indexOf(m) === i).slice(0, 2);
    partes.push(notas.length + (notas.length > 1 ? ' notas nuevas' : ' nota nueva') +
      (mats.length ? ' (' + mats.join(', ') + ')' : ''));
  }
  if (avisos.length) partes.push(avisos.length + ' aviso(s) del maestro');
  if (faltas.length) partes.push(faltas.length + ' falta(s) registrada(s)');
  if (otrosAd.length) partes.push('cambios en boleta o pagos');
  if (!partes.length) return;
  await botSay('👀 <strong>Desde su última visita' + (prev.t ? ' (' + fmtFecha(prev.t) + ')' : '') +
    ':</strong> ' + esc(partes.join(' · ')) + '.');
}

/* ── PWA: instalable y abre sin señal (mismo sw.js del index) ── */
let _pwaPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _pwaPrompt = e; });
if ('serviceWorker' in navigator) {
  try { navigator.serviceWorker.register('sw.js'); } catch (_) {}
}
/* Tras la primera consulta con éxito se sugiere UNA vez dejar el
   asistente como app en la pantalla de inicio */
async function sugerirInstalar() {
  try {
    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return;
  } catch (_) {}
  const c = cfgLoad();
  if (c.pwaHint) return;
  c.pwaHint = 1; cfgSave(c);
  if (_pwaPrompt) {
    await botSay('📲 ¿Quiere dejar este asistente como una <strong>app</strong> en su teléfono, ' +
      'para abrirlo con un toque? Toque el botón:', ['📲 Instalar el asistente'].concat(chipsMenu()));
  } else {
    await botSay('📲 <strong>Consejo:</strong> en el menú del navegador (⋮) toque ' +
      '«<strong>Agregar a pantalla de inicio</strong>» y este asistente le quedará como una app.', chipsMenu());
  }
}

/* ── envío ── */
function enviar() {
  const v = $inp.value.trim();
  if (!v) return;
  $inp.value = '';
  userSay(v);
  manejar(v);
}
document.getElementById('enviar').addEventListener('click', enviar);
$inp.addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });

/* ── arranque ── */
(async function inicio() {
  try { if (cfgLoad().corto) document.body.classList.add('corto'); } catch (_) {}
  const codigo = claveGuardada();
  await botSay('¡Hola! 👋 Soy el <strong>asistente de M.E.T.A.S</strong> para madres y padres. ' +
    'Le cuento cómo va su hijo/a en la escuela: notas, mensajes del maestro y consejos para apoyar en casa.');
  if (codigo) {
    const alias = aliasDe(codigo);
    await botSay('Tengo guardada la clave <strong>' + esc(claveBonita(codigo)) + '</strong>' +
      (alias ? ' (' + esc(alias) + ')' : '') + '. Consultando las notas…');
    const prev = cacheLoad(codigo);   /* para contar novedades al volver */
    const st = await consultar(codigo);
    if (st === 'ok' || st === 'cache') {
      if (st === 'ok') await novedadesDesde(prev);
      await respResumen(); await sugerirInstalar();
    }
    else if (st === 'vacio') {
      await botSay('Aún no hay notas para esa clave. Toque «🔄 Actualizar» más tarde, o cambie la clave si no es la correcta.',
        ['🔄 Actualizar', '🔑 Cambiar clave', '❓ ¿Qué es la clave?']);
    } else if (st === 'offline') {
      await botSay('📴 No hay internet ahorita y no tengo notas guardadas. Vuelva a intentarlo con conexión.',
        ['🔄 Actualizar', '💡 Consejo']);
    } else {
      await botSay('⚠️ No pude consultar la nube. Intente «🔄 Actualizar» en unos minutos.',
        ['🔄 Actualizar', '💡 Consejo']);
    }
  } else {
    await botSay('Para empezar, escriba la <strong>clave de la familia</strong> que le entregó el maestro en una tira de papel ' +
      '(empieza con el número de lista, ej. <strong>15-K7QM</strong>). Es secreta: solo su familia la conoce. 🔑',
      ['❓ ¿Qué es la clave?']);
  }
})();
</script>
